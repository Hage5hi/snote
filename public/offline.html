<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Syrin Notes</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0f0f12; color: #e5e5e7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { max-width: 420px; text-align: center; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; color: #a1a1aa; }
      button { background: #fff; color: #0f0f12; border: 0; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }
      button:hover { background: #e5e5e7; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Bạn đang offline</h1>
        <p>Không có kết nối mạng. Các note đã mở trước đó vẫn truy cập được từ trang chủ nhờ bản lưu cục bộ.</p>
        <button onclick="location.reload()">Thử lại</button>
      </div>
    </div>
  </body>
</html>
