name: E2E (new specs, PR gate)

# Runs one deterministic Chromium smoke on every pull request. The full
# cross-browser matrix remains available outside the required PR gate.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-pr:
    name: e2e-pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PROJECT: chromium
      PLAYWRIGHT_RETRIES: "0"
      # Home smoke must be deterministic and must not require repository
      # secrets. No backend request is made by this test.
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Run deterministic PR smoke
        run: |
          bunx playwright test \
            e2e/ci-baseline-smoke.spec.ts \
            --project=chromium \
            --retries=${PLAYWRIGHT_RETRIES}
      - name: Upload HTML report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-new-specs-report-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Playwright traces, videos & screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # playwright.config.ts sets trace/video/screenshot to
          # retain-on-failure / only-on-failure, so test-results/ contains
          # the per-test artifacts needed to debug the failing run.
          name: e2e-new-specs-test-results-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
