name: E2E (new specs, PR gate)

# Runs the three new E2E specs on every pull request and blocks merges on
# failures. Kept as a separate lightweight workflow so the full cross-browser
# matrix in `e2e.yml` doesn't gate every PR while still ensuring the new
# specs stay green.

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e-new-specs.yml"
  workflow_dispatch:

jobs:
  e2e-new-specs:
    name: playwright e2e (new specs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PROJECT: chromium
      PLAYWRIGHT_RETRIES: "2"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Run new PR-gate specs
        run: |
          bunx playwright test \
            e2e/note-menu-no-rename-duplicate.spec.ts \
            e2e/pwa-update-debug-panel.spec.ts \
            e2e/theme-toggle-no-system.spec.ts \
            --project=chromium \
            --retries=${PLAYWRIGHT_RETRIES}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-new-specs-report-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
