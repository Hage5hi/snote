name: E2E (new specs, PR gate)

# Runs the three new E2E specs on every pull request and blocks merges on
# failures. Kept as a separate lightweight workflow so the full cross-browser
# matrix in `e2e.yml` doesn't gate every PR while still ensuring the new
# specs stay green.

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e-new-specs.yml"
  workflow_dispatch:

jobs:
  e2e-new-specs:
    name: playwright e2e (new specs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PROJECT: chromium
      PLAYWRIGHT_RETRIES: "2"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Run new PR-gate specs
        run: |
          bunx playwright test \
            e2e/note-menu-no-rename-duplicate.spec.ts \
            e2e/pwa-update-debug-panel.spec.ts \
            e2e/pwa-readiness-gate.spec.ts \
            e2e/pwa-readiness-malformed.spec.ts \
            e2e/pwa-update-full-flow.spec.ts \
            e2e/rename-duplicate-routes-404.spec.ts \
            e2e/rename-duplicate-disabled-shortcuts.spec.ts \
            e2e/rename-duplicate-deep-link-variants.spec.ts \
            e2e/pwa-readiness-malformed-then-valid.spec.ts \
            e2e/pwa-readiness-malformed-then-valid-flow.spec.ts \
            e2e/no-runtime-errors-malformed-and-deeplinks.spec.ts \
            e2e/pwa-reload-strategy-soft-after-fix.spec.ts \
            e2e/pwa-update-offline.spec.ts \
            e2e/pwa-debug-panel-visual-snapshot.spec.ts \
            e2e/rename-duplicate-deep-link-console-strict.spec.ts \
            e2e/theme-toggle-no-system.spec.ts \
            --project=chromium \
            --retries=${PLAYWRIGHT_RETRIES}
      - name: Upload HTML report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-new-specs-report-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Playwright traces, videos & screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # playwright.config.ts sets trace/video/screenshot to
          # retain-on-failure / only-on-failure, so test-results/ contains
          # the per-test artifacts needed to debug the failing run.
          name: e2e-new-specs-test-results-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
