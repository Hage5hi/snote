name: PWA update smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: Base URL to smoke-test
        required: false
        default: https://note.syrin.online

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: pwa-update-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: >-
        ${{
          github.event.deployment_status.target_url ||
          github.event.inputs.target_url ||
          'https://note.syrin.online'
        }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-frame-ancestors.sh "$SMOKE_BASE_URL"
      - run: bunx playwright install --with-deps chromium
      - name: Run post-deploy smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.SMOKE_BASE_URL }}
        run: >-
          bunx playwright test
          e2e/pwa-update-multi-click.spec.ts
          e2e/pwa-update-no-url-v-param.spec.ts
          --project=chromium
          --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pwa-update-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
