name: PWA update smoke

on:
  repository_dispatch:
    types: [production-deployed]
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Exact 40-character commit deployed to production
        required: true
        type: string
      build_id:
        description: Exact buildId emitted by deployed version.json (diagnostic only; not source attestation)
        required: true
        type: string
      target_url:
        description: Canonical production URL to smoke-test
        required: true
        default: https://note.syrin.online
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.deployed_sha || inputs.deployed_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: pwa-update-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOYED_SHA: ${{ github.event.client_payload.deployed_sha || inputs.deployed_sha }}
      BUILD_ID: ${{ github.event.client_payload.build_id || inputs.build_id }}
      SMOKE_BASE_URL: ${{ github.event.client_payload.target_url || inputs.target_url }}
      RELEASE_MANIFEST_PATH: docs/security/release-manifests/2026-07-capability-rollout.md
      POST_DEPLOY_SMOKE: "1"
      EXPECTED_BUILD_ID: ${{ github.event.client_payload.build_id || inputs.build_id }}
      EXPECTED_DEPLOYED_SHA: ${{ github.event.client_payload.deployed_sha || inputs.deployed_sha }}
    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deployed_sha must be an exact lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "$BUILD_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]]; then
            echo "build_id must be a sanitized provider identifier" >&2
            exit 1
          fi
          if [[ "$SMOKE_BASE_URL" != "https://note.syrin.online" && "$SMOKE_BASE_URL" != "https://note.syrin.online/" ]]; then
            echo "target_url must be the canonical production origin" >&2
            exit 1
          fi
      - name: Checkout approved release manifest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify release manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidate_lines < <(
            sed -nE 's/^- Release candidate SHA: `([0-9a-f]{40})`$/\1/p' "$RELEASE_MANIFEST_PATH"
          )
          if [[ "${#candidate_lines[@]}" -ne 1 ]]; then
            echo "release manifest must contain exactly one exact candidate SHA" >&2
            exit 1
          fi
          candidate_sha="${candidate_lines[0]}"
          if [[ "$candidate_sha" != "$DEPLOYED_SHA" ]]; then
            echo "deployed_sha does not match the approved release-manifest candidate" >&2
            exit 1
          fi
      - name: Checkout approved deployed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ env.DEPLOYED_SHA }}
      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$DEPLOYED_SHA" ]]; then
            echo "checkout SHA mismatch: expected $DEPLOYED_SHA, got $actual_sha" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build trusted local release manifest
        env:
          SNOTE_BUILD_ID: ${{ env.BUILD_ID }}
          SNOTE_RELEASE_SHA: ${{ env.DEPLOYED_SHA }}
        run: bun run build:release
      - run: bash scripts/verify-frame-ancestors.sh "$SMOKE_BASE_URL"
      - run: bunx playwright install --with-deps chromium
      - name: Run post-deploy smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.SMOKE_BASE_URL }}
          POST_DEPLOY_SMOKE: "1"
          EXPECTED_BUILD_ID: ${{ env.BUILD_ID }}
          EXPECTED_DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        run: >-
          bunx playwright test
          e2e/pwa-update-production-readonly.spec.ts
          --project=chromium
          --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pwa-update-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
