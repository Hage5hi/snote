name: Workflow structure and toolchain contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "scripts/**/*.ts"
      - "e2e/**/*.ts"
      - "e2e-extension/**/*.ts"
      - "chrome-extension/**/*.ts"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "scripts/**/*.ts"
      - "e2e/**/*.ts"
      - "e2e-extension/**/*.ts"
      - "chrome-extension/**/*.ts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -shellcheck=

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint
        if: success() || failure()
        run: bun run lint
      - name: Typecheck app
        if: success() || failure()
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck node config
        if: success() || failure()
        run: bunx tsc --noEmit -p tsconfig.node.json
      - name: Typecheck scripts, e2e and extension TypeScript
        if: success() || failure()
        run: bunx tsc --noEmit -p tsconfig.tools.json
      - name: Collect Playwright tests
        if: success() || failure()
        run: bunx playwright test --list --project=chromium
      - name: Verify CI toolchain contract
        if: success() || failure()
        run: bunx vitest run scripts/__tests__/ci-toolchain-contract.test.ts
