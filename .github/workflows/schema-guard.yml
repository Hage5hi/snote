name: schema-guard
# Runs on every PR (and pushes to main) to fail fast if the published
# JSON Schemas or their generated TypeScript types are out of sync, or
# if the CLI-emitted schemaVersion drifts from the pinned schema const.
# Kept separate from the big CI matrix so PR authors get feedback in
# under a minute instead of waiting for the full suite.

on:
  pull_request:
    paths:
      - "schemas/focus-trap-inspect-*.schema.json"
      - "scripts/_helpers/focus-trap-inspect.ts"
      - "scripts/_helpers/focus-trap-inspect-schema.types.gen.ts"
      - "scripts/generate-focus-trap-schema-types.ts"
      - "scripts/inspect-focus-trap.ts"
      - "scripts/__tests__/focus-trap-json-schemas*.test.ts"
      - ".github/workflows/schema-guard.yml"
  push:
    branches: [main]
    paths:
      - "schemas/focus-trap-inspect-*.schema.json"
      - "scripts/_helpers/focus-trap-inspect.ts"
      - "scripts/_helpers/focus-trap-inspect-schema.types.gen.ts"
      - "scripts/generate-focus-trap-schema-types.ts"
  # Nightly drift sweep — catches schemas/types that regenerate differently
  # under a newer toolchain (Bun / json-schema-to-typescript) before the
  # divergence lands in a PR. Posts an issue comment on drift; PR runs
  # keep their existing fail-the-check behavior.
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview drift only — regenerate + report diff without failing the job"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: schema-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Published JSON Schema files must exist + parse
        run: |
          set -euo pipefail
          for f in \
            schemas/focus-trap-inspect-report.schema.json \
            schemas/focus-trap-inspect-diff.schema.json; do
            [ -s "$f" ] || { echo "missing/empty schema: $f"; exit 1; }
            bun -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f" \
              || { echo "invalid JSON in schema: $f"; exit 1; }
            echo "OK $f"
          done

      - name: schema:types:check (regenerate + fail on drift)
        id: schema_types_check
        env:
          # Dry-run mode: available on workflow_dispatch. Regenerates,
          # captures the same diff bundle, but exits 0 so on-call can
          # preview drift before it blocks a merge on a real PR.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p _schema_drift/committed _schema_drift/regenerated
          cp scripts/_helpers/focus-trap-inspect-schema.types.gen.ts \
             _schema_drift/committed/focus-trap-inspect-schema.types.gen.ts
          cp schemas/focus-trap-inspect-report.schema.json \
             _schema_drift/committed/focus-trap-inspect-report.schema.json
          cp schemas/focus-trap-inspect-diff.schema.json \
             _schema_drift/committed/focus-trap-inspect-diff.schema.json

          drift=0
          if ! bun run schema:types:check > _schema_drift/check.log 2>&1; then
            drift=1
            bun run schema:types || true

            cp scripts/_helpers/focus-trap-inspect-schema.types.gen.ts \
               _schema_drift/regenerated/focus-trap-inspect-schema.types.gen.ts
            cp schemas/focus-trap-inspect-report.schema.json \
               _schema_drift/regenerated/focus-trap-inspect-report.schema.json
            cp schemas/focus-trap-inspect-diff.schema.json \
               _schema_drift/regenerated/focus-trap-inspect-diff.schema.json

            for f in \
              focus-trap-inspect-schema.types.gen.ts \
              focus-trap-inspect-report.schema.json \
              focus-trap-inspect-diff.schema.json; do
              diff -u "_schema_drift/committed/$f" "_schema_drift/regenerated/$f" \
                > "_schema_drift/${f}.diff" || true
            done

            grep -E 'SCHEMA_VERSION\s*=' scripts/_helpers/focus-trap-inspect.ts \
              > _schema_drift/cli-schema-versions.txt || true
          fi
          # Expose drift state to later steps regardless of exit code so
          # the artifact upload / summary run in dry-run mode too.
          echo "drift=${drift}" >> "$GITHUB_OUTPUT"

          if [ "$drift" = "1" ]; then
            echo "schema/types drift — see the 'schema-drift' CI artifact."
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice title=schema-guard dry-run::drift detected — NOT failing the job (dry_run=true)"
              exit 0
            fi
            echo "Then run: bun run schema:types  and commit the regenerated files."
            exit 1
          fi

      - name: Upload regenerated schema diff bundle (on drift)
        if: (failure() || steps.schema_types_check.outputs.drift == '1')
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift
          path: _schema_drift/
          if-no-files-found: warn
          retention-days: 14


      - name: Job summary — top schemaVersion mismatches (on drift)
        if: always() && steps.schema_types_check.outputs.drift == '1'
        run: |
          set -euo pipefail
          {
            echo "## 🔀 schema-guard drift detected"
            echo ""
            echo "**Top schemaVersion mismatches** (CLI consts vs published JSON Schemas):"
            echo ""
            echo '```'
            # Reuse the same CLI-vs-schema comparison logic and surface
            # the drifting pairs. Reads cli-schema-versions.txt captured
            # in the drift bundle so on-call sees the exact CLI values.
            if [ -s _schema_drift/cli-schema-versions.txt ]; then
              echo "# CLI-side (scripts/_helpers/focus-trap-inspect.ts):"
              sed -e 's/^[[:space:]]*//' _schema_drift/cli-schema-versions.txt
              echo ""
            fi
            echo "# Published schemas:"
            for f in schemas/focus-trap-inspect-report.schema.json schemas/focus-trap-inspect-diff.schema.json; do
              v=$(bun -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(j.properties?.schemaVersion?.const ?? "<none>")' "$f" 2>/dev/null || echo "<parse-error>")
              printf "  %-58s %s\n" "$f" "$v"
            done
            echo '```'
            echo ""
            echo "Full diff bundle: **schema-drift** artifact (committed/, regenerated/, per-file \`.diff\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on drift (nightly / manual runs)
        if: always() && steps.schema_types_check.outputs.drift == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const readDiff = (p) => { try { return fs.readFileSync(p,"utf8").trim(); } catch { return ""; } };
            const bundle = [
              "_schema_drift/focus-trap-inspect-schema.types.gen.ts.diff",
              "_schema_drift/focus-trap-inspect-report.schema.json.diff",
              "_schema_drift/focus-trap-inspect-diff.schema.json.diff",
            ].map((p) => ({ p, d: readDiff(p) })).filter((x) => x.d);
            const cliVers = readDiff("_schema_drift/cli-schema-versions.txt");
            const snippet = (s, n = 60) => s.split("\n").slice(0, n).join("\n");
            const body = [
              `### 🌙 Nightly schema-guard drift on \`${context.sha.slice(0, 7)}\``,
              ``,
              `Regenerated schema JSON / TypeScript no longer matches the committed files.`,
              ``,
              `**CLI schemaVersion consts:**\n\`\`\`\n${cliVers || "(none captured)"}\n\`\`\``,
              ``,
              ...bundle.map(({ p, d }) => `<details><summary>${p}</summary>\n\n\`\`\`diff\n${snippet(d)}\n\`\`\`\n</details>`),
              ``,
              `Run: ${process.env.RUN_URL}`,
              `Fix: \`bun run schema:types\` then commit the regenerated files.`,
            ].join("\n");
            // Post to a dedicated tracking issue if one exists (labelled
            // `schema-drift`); otherwise open a fresh one. Keeps signal
            // in a single thread on-call can subscribe to.
            const owner = context.repo.owner, repo = context.repo.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "schema-drift", per_page: 1,
            });
            if (issues.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title: "schema-guard: nightly drift detected",
                labels: ["schema-drift"], body,
              });
            }

      - name: CLI schemaVersion must match published JSON Schemas
        run: |
          set -euo pipefail
          bun -e '
            const fs = require("fs");
            const src = fs.readFileSync("scripts/_helpers/focus-trap-inspect.ts","utf8");
            const pick = (n) => {
              const m = src.match(new RegExp(`${n}\\s*=\\s*"([^"]+)"`));
              if (!m) throw new Error("missing const "+n);
              return m[1];
            };
            const report = JSON.parse(fs.readFileSync("schemas/focus-trap-inspect-report.schema.json","utf8"));
            const diff   = JSON.parse(fs.readFileSync("schemas/focus-trap-inspect-diff.schema.json","utf8"));
            const pairs = [
              ["JSON_REPORT_SCHEMA_VERSION", pick("JSON_REPORT_SCHEMA_VERSION"), report.properties.schemaVersion.const],
              ["DIFF_JSON_SCHEMA_VERSION",   pick("DIFF_JSON_SCHEMA_VERSION"),   diff.properties.schemaVersion.const],
            ];
            let ok = true;
            for (const [n, cli, schema] of pairs) {
              if (cli !== schema) { console.error(`drift: ${n} CLI=${cli} schema=${schema}`); ok = false; }
              else console.log(`OK ${n}=${cli}`);
            }
            process.exit(ok ? 0 : 1);
          '

      - name: Schema contract tests (Vitest)
        run: |
          bunx vitest run \
            scripts/__tests__/focus-trap-json-schemas.test.ts \
            scripts/__tests__/focus-trap-json-schemas-negative.test.ts \
            scripts/__tests__/focus-trap-schema-types.test.ts \
            scripts/__tests__/focus-trap-validator-json-pointer.test.ts \
            scripts/__tests__/focus-trap-validator-pointer-escape.test.ts \
            scripts/__tests__/focus-trap-validator-pointer-format.test.ts
