name: E2E (Playwright)

# Runs the lock/unlock Playwright suites across Chromium, Firefox, and WebKit
# to confirm behavior is consistent across engines. Uploads report + traces +
# videos + screenshots on BOTH success and failure with stable per-browser
# artifact names so flaky-test debugging is easy.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: playwright e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_RETRIES: "2"
      PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Cache Playwright browser binaries between runs to shave install time
      # off both the matrix browser and the chromium replay tooling install.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb') }}-${{ matrix.browser }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb') }}-
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      # Ensure chromium is always present so scripts/replay-wheel-diagnostics.ts
      # (which defaults to chromium) can run in the CI job regardless of matrix.
      - name: Install Playwright chromium for replay tooling
        if: matrix.browser != 'chromium'
        run: bunx playwright install --with-deps chromium
      - name: Validate wheel diagnostics fixture
        run: bun run scripts/validate-wheel-fixture.ts
      - name: Run lock/unlock e2e specs
        run: |
          bunx playwright test \
            --retries=${PLAYWRIGHT_RETRIES} \
            e2e/note-lock-unlock.spec.ts \
            e2e/note-lock-unlock-modes.spec.ts \
            e2e/note-lock-unlock-rapid.spec.ts \
            e2e/note-lock-unlock-history.spec.ts \
            e2e/note-lock-multi-tab.spec.ts \
            e2e/note-lock-stress.spec.ts \
            e2e/note-lock-remount-timing.spec.ts \
            e2e/note-lock-api-authz.spec.ts \
            e2e/note-wheel-trackpad-scroll.spec.ts
      - name: Publish E2E timing and artifact summary
        if: always()
        run: bun run scripts/ci-perf-timing-summary.ts --pw test-results/e2e-results.json
      # Upload on BOTH success and failure so flaky-test triage doesn't need a
      # re-run. Names are stable per browser + run + attempt so artifacts from
      # parallel matrix jobs never collide.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright traces, screenshots & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload wheel replay diagnostics (out-dir)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-replay-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/wheel-replay/
          retention-days: 14
          if-no-files-found: ignore
