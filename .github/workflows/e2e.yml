name: E2E (Playwright)

# Runs the lock/unlock Playwright suites across Chromium, Firefox, and WebKit
# to confirm behavior is consistent across engines. Uploads report + traces +
# videos + screenshots on BOTH success and failure with stable per-browser
# artifact names so flaky-test debugging is easy.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: playwright e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_RETRIES: "2"
      PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Cache Playwright browser binaries between runs to shave install time
      # off both the matrix browser and the chromium replay tooling install.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}-${{ matrix.browser }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser (${{ matrix.browser }})
        run: |
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            bash scripts/ensure-playwright-browsers.sh
          else
            bunx playwright install --with-deps ${{ matrix.browser }}
          fi
      # Ensure chromium is always present so scripts/replay-wheel-diagnostics.ts
      # (which defaults to chromium) can run in the CI job regardless of matrix.
      - name: Install Playwright chromium for replay tooling
        if: matrix.browser != 'chromium'
        run: bash scripts/ensure-playwright-browsers.sh
      - name: Validate wheel diagnostics fixture
        run: bun run scripts/validate-wheel-fixture.ts
      - name: Run full e2e suite
        run: |
          bash scripts/run-playwright.sh test \
            --retries=${PLAYWRIGHT_RETRIES}
      - name: Run full e2e suite with system Chromium fallback
        if: matrix.browser == 'chromium'
        env:
          PLAYWRIGHT_FORCE_SYSTEM_CHROMIUM: "1"
          PLAYWRIGHT_PROJECT: chromium
        run: |
          bash scripts/run-playwright.sh test \
            --retries=${PLAYWRIGHT_RETRIES}
      - name: Publish E2E timing and artifact summary
        if: always()
        run: bun run scripts/ci-perf-timing-summary.ts --pw test-results/e2e-results.json
      - name: Verify stress replay attachments
        if: always()
        env:
          PW_JSON: test-results/e2e-results.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const pwJson = process.env.PW_JSON;
            if (!fs.existsSync(pwJson)) {
              console.log("[verify-stress] no " + pwJson + " — Playwright did not run to completion; skipping check.");
              process.exit(0);
            }
            const raw = fs.readFileSync(pwJson, "utf8");
            if (!/note-rename-yjs-race/.test(raw)) {
              console.log("[verify-stress] stress spec did not run; skipping check.");
              process.exit(0);
            }
            function findAll(root, name) {
              const out = [];
              if (!fs.existsSync(root)) return out;
              const stack = [root];
              while (stack.length) {
                const dir = stack.pop();
                let entries;
                try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
                for (const e of entries) {
                  const p = path.join(dir, e.name);
                  if (e.isDirectory()) stack.push(p);
                  else if (name instanceof RegExp ? name.test(e.name) : e.name === name) out.push(p);
                }
              }
              return out;
            }
            const seed = [...findAll("playwright-report", /^stress-seed.*\.json$/),
                          ...findAll("test-results", /^stress-seed.*\.json$/)];
            const timings = [...findAll("playwright-report", /^stress-timings.*\.json$/),
                             ...findAll("test-results", /^stress-timings.*\.json$/)];
            console.log("[verify-stress] stress-seed*.json:", seed.length ? seed : "MISSING");
            console.log("[verify-stress] stress-timings*.json:", timings.length ? timings : "MISSING");
            if (!seed.length || !timings.length) {
              console.error("[verify-stress] required stress replay attachments missing — the rerun-from-report workflow will be broken. Fix the test instrumentation in e2e/note-rename-yjs-race.spec.ts.");
              process.exit(1);
            }
          '
      - name: Upload stress replay attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-replay-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            playwright-report/**/stress-seed*.json
            playwright-report/**/stress-timings*.json
            test-results/**/stress-seed*.json
            test-results/**/stress-timings*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Consolidate PWA update buildId summary
        if: always()
        run: bun run scripts/collect-pwa-update-summary.ts --out test-results/pwa-update-summary.json
      - name: Upload PWA update metadata attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-update-metadata-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            playwright-report/**/pwa-update-*.json
            test-results/**/pwa-update-*.json
            test-results/pwa-update-summary.json
          retention-days: 14
      # PWA update spec failures: upload only the trace/video/screenshot bundles
      # from the three pwa-update-*.spec.ts files so triage doesn't require
      # downloading the full test-results/ archive.
      - name: Upload PWA update failure artifacts (traces + screenshots + videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-update-failures-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: |
            test-results/**/pwa-update-*/**
            test-results/**/*pwa-update*trace*.zip
            test-results/**/*pwa-update*.png
            test-results/**/*pwa-update*.webm
            playwright-report/**/pwa-update-*.json
            playwright-report/**/pwa-update-*.png
            playwright-report/**/pwa-update-*.html
          retention-days: 14
          if-no-files-found: warn
      # Upload on BOTH success and failure so flaky-test triage doesn't need a
      # re-run. Names are stable per browser + run + attempt so artifacts from
      # parallel matrix jobs never collide.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright traces, screenshots & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload wheel replay diagnostics (out-dir)
        id: upload-wheel-replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-replay-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/wheel-replay/
          retention-days: 14
          if-no-files-found: ignore
      # Emit a job-summary section that links directly to the uploaded wheel
      # replay artifact for this matrix run so reviewers can jump straight to
      # the diagnostics + trace zips without hunting through the artifacts UI.
      - name: Link wheel replay artifacts in job summary
        if: always()
        env:
          ARTIFACT_NAME: wheel-replay-${{ matrix.browser }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.upload-wheel-replay.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Wheel replay diagnostics — ${{ matrix.browser }} (retries=${PLAYWRIGHT_RETRIES})"
            if [ -n "${ARTIFACT_URL}" ]; then
              echo "- Artifact: [${ARTIFACT_NAME}](${ARTIFACT_URL})"
            else
              echo "- Artifact: \`${ARTIFACT_NAME}\` (see [run artifacts](${RUN_URL}#artifacts))"
            fi
            echo "- Contents: \`test-results/wheel-replay/<project>-r<retries>/\` (manifest.json, replay-result.json, wheel-deltas.jsonl, selection-frames.jsonl, scroller.png, trace.zip)"
          } >> "$GITHUB_STEP_SUMMARY"
