name: E2E (Playwright)

# Runs the top-level /e2e Playwright suite on PRs. Uploads video / screenshot
# / trace artifacts on failure so regressions can be inspected without a
# local repro.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lockb"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Stable retries: config default is 0; bump for CI only.
      PLAYWRIGHT_RETRIES: "2"
      # Only the lock/unlock specs need Supabase env; other specs are UI-only.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install --with-deps chromium
      - name: Run lock/unlock e2e specs
        run: |
          bunx playwright test \
            --retries=${PLAYWRIGHT_RETRIES} \
            e2e/note-lock-unlock.spec.ts \
            e2e/note-lock-unlock-modes.spec.ts \
            e2e/note-lock-unlock-rapid.spec.ts
      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Playwright traces, screenshots & videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
