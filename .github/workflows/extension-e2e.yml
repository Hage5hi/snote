name: Extension E2E

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/**"
      - "e2e-extension/**"
      - "scripts/audit-extension.sh"
      - "scripts/build-extension-zip.ts"
      - "scripts/extension-archive.ts"
      - "scripts/verify-extension-zip.ts"
      - "scripts/verify-extension-zip.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/extension-e2e.yml"
  pull_request:
    paths:
      - "chrome-extension/**"
      - "e2e-extension/**"
      - "scripts/audit-extension.sh"
      - "scripts/build-extension-zip.ts"
      - "scripts/extension-archive.ts"
      - "scripts/verify-extension-zip.ts"
      - "scripts/verify-extension-zip.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/extension-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension-e2e:
    name: extension-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bash scripts/verify-extension-zip.sh
      - run: bash scripts/audit-extension.sh
      - run: bunx playwright install --with-deps chromium
      - name: Run unpacked extension suite
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x800x24"
          bunx playwright test
          --config=e2e-extension/playwright.config.ts
          --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            chrome-extension/
            public/syrin-note-sidepanel.zip
            public/syrin-note-sidepanel.zip.manifest.json
          if-no-files-found: ignore
          retention-days: 14
