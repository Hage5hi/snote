name: Extension E2E (Playwright)

# Runs the chrome-extension Playwright suite against the unpacked extension.
# Triggers only on changes that can affect the extension, so it doesn't slow
# down unrelated PRs. Uses xvfb because the persistent-context launch needs a
# headed Chromium (MV3 service workers + chrome.sidePanel APIs).

on:
  push:
    branches: [main]
    paths:
      - "chrome-extension/**"
      - "e2e-extension/**"
      - ".github/workflows/extension-e2e.yml"
  pull_request:
    paths:
      - "chrome-extension/**"
      - "e2e-extension/**"
      - ".github/workflows/extension-e2e.yml"
  workflow_dispatch:

jobs:
  extension-e2e:
    name: chrome-extension E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install --with-deps chromium
      - name: Run extension E2E under xvfb
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            bunx playwright test --config=e2e-extension/playwright.config.ts \
            --reporter=list,html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
