            echo '| Bundle | File |'
            echo '|---|---|'
            shopt -s nullglob
            any=0
            for f in reports/_ci/sticky-replay/*; do
              [ -e "$f" ] || continue
              echo "| [\`sticky-replay\`](${RUN_URL}) | \`$(basename "$f")\` |"
              any=1
            done
            for f in reports/_ci/sticky-fuzz-failures/*; do
              [ -e "$f" ] || continue
              echo "| [\`sticky-fuzz-failures\`](${RUN_URL}) | \`$(basename "$f")\` |"
              any=1
            done
            if [ "$any" = "0" ]; then
