name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Application checks exercise only local behavior. Keep them deterministic and
# available to fork PRs without exposing or depending on repository secrets.
env:
  VITE_SUPABASE_URL: https://ci.invalid
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -shellcheck=
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.3
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run lint
      - run: bun run knip
      - run: bun run i18n:check
      - run: bun run i18n:allowlist
      - run: bunx tsc --noEmit -p tsconfig.app.json
      - run: bunx tsc --noEmit -p tsconfig.node.json
      - run: bunx tsc --noEmit -p tsconfig.tools.json
      - run: bun run typecheck:edge
      - run: bun run test:coverage
      - run: bun run build:check

  e2e-pr:
    name: e2e-pr
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run critical Chromium smoke
        run: >-
          bunx playwright test
          e2e/critical-a11y.spec.ts
          e2e/pwa-update-sw-stall.spec.ts
          --project=chromium
          --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pr-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-full:
    name: e2e-full-${{ matrix.browser }}
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full browser suite
        run: bunx playwright test --project=${{ matrix.browser }} --retries=0
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
