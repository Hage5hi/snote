      # can see at a glance what's downloadable, and click straight to
      # the artifact downloads on the workflow run page.
      - name: Sticky artifacts — print downloadable table
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
