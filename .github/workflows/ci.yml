            echo "| \`sticky-artifacts-manifest\` (\`sticky-artifacts-manifest/v1\`) | \`reports/_ci/sticky-artifacts-manifest.json\` | [open run artifacts]($RUN_URL) |"
            echo "| \`sticky-validate-summary\` (\`sticky-validate-summary/v1\`) | \`reports/_ci/sticky-validate-summary.json\` | [open run artifacts]($RUN_URL) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun run build:check



  i18n:
    # Coverage gate + focused i18n unit suite. Fails when any language drops
    # below 100% key coverage or has placeholder mismatches against English.
    name: i18n coverage · IP fallback · storage sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            i18n:
              - 'src/i18n/**'
              - 'scripts/i18n-coverage.ts'
              - 'src/components/LanguageToggle.tsx'
              - 'src/components/note/topbar/**'
              - 'src/components/note/*.tsx'
              - 'src/pages/Home.tsx'
              - 'src/App.tsx'
              - 'e2e/**'
              - 'playwright.config.ts'
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        name: i18n coverage gate (writes JSON + HTML report)
        run: bun run i18n:check
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: i18n audit + diff (hardcoded strings)
        run: bun run i18n:audit || true
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: i18n hardcoded-string allowlist gate (always writes report)
        # `|| true` so the upload step still runs and surfaces the
        # generated reports/i18n-allowlist-report.{json,md}. The gate is
        # re-enforced below after artifacts have been uploaded.
        id: allowlist_gate
        run: bun run i18n:allowlist || echo "ALLOWLIST_FAILED=1" >> "$GITHUB_ENV"
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: Focused i18n + allowlist-script vitest suites
        run: bunx vitest run src/i18n/__tests__/ scripts/__tests__/
      # Dedicated step (runs on every PR) for the CLI flag integration +
      # --help snapshot suites so regressions in argv parsing, flag
      # aliasing, truncation, or doc/help drift surface as their own
      # red check rather than being lost in the broader suite.
      #
      # `--coverage` is enabled on pull requests so the lcov report can
      # be uploaded as an artifact for reviewers; on push to main we skip
      # coverage to keep the gate fast.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: cli_suites
        name: i18n allowlist CLI flag integration + snapshot suites
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx vitest run \
              --coverage \
              --coverage.include='scripts/i18n-allowlist-*.ts' \
              --coverage.reporter=text \
              --coverage.reporter=lcov \
              --coverage.reporter=html \
              --coverage.reportsDirectory=coverage/i18n-cli \
              scripts/__tests__/i18n-allowlist-cli-integration.test.ts \
              scripts/__tests__/i18n-allowlist-cli-scoping.test.ts \
              scripts/__tests__/i18n-allowlist-cli-flags.test.ts \
              scripts/__tests__/i18n-allowlist-cli-parity.test.ts \
              2>&1 | tee /tmp/i18n-cli-suite.log
          else
            bunx vitest run \
              scripts/__tests__/i18n-allowlist-cli-integration.test.ts \
              scripts/__tests__/i18n-allowlist-cli-scoping.test.ts \
              scripts/__tests__/i18n-allowlist-cli-flags.test.ts \
              scripts/__tests__/i18n-allowlist-cli-parity.test.ts \
              2>&1 | tee /tmp/i18n-cli-suite.log
          fi
          status=${PIPESTATUS[0]}
          mkdir -p reports/_ci
          cp /tmp/i18n-cli-suite.log reports/_ci/i18n-cli-suite.log || true
          # Concise per-failure breakdown (suite → test → main diff) parsed
          # from the raw vitest log. On green runs this prints a single
          # "no failing tests" line; on red runs it emits a markdown
          # section per failing suite. `--json` writes a machine-readable
          # mirror so downstream tooling / PR bots can consume the same
          # parsed shape without re-parsing the log.
          bun run scripts/ci-vitest-failure-summary.ts /tmp/i18n-cli-suite.log \
            --json reports/_ci/failure-breakdown.json \
            > reports/_ci/failure-breakdown.md || true
          {
            echo '### i18n allowlist CLI suites — failure breakdown'
            cat reports/_ci/failure-breakdown.md
            echo ''
            echo '<details><summary>Raw vitest tail (last 200 lines)</summary>'
            echo ''
            echo '```'
            tail -200 /tmp/i18n-cli-suite.log
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$GITHUB_STEP_SUMMARY" reports/_ci/step-summary.md || true
          # Record whether the help-snapshot test actually produced a diff
          # so the artifact-bundle step can include the file only when
          # real and otherwise log a clear reason for its absence.
          if [ -f reports/_ci/help-snapshot.diff ]; then
            echo "HELP_SNAPSHOT_DIFF_PRESENT=1" >> "$GITHUB_ENV"
            echo "help-snapshot diff present (snapshot drift detected)" \
              > reports/_ci/help-snapshot.reason.txt
          else
            echo "HELP_SNAPSHOT_DIFF_PRESENT=0" >> "$GITHUB_ENV"
            echo "help-snapshot diff not produced — --help output matched the committed snapshot, or the snapshot test did not run / failed before writing the diff." \
              > reports/_ci/help-snapshot.reason.txt
          fi
          exit $status
      # When the CLI suites fail, ship the full raw log, the parsed
      # breakdown (markdown + JSON), the step summary, the help-snapshot
      # diff (only when actually produced — see HELP_SNAPSHOT_DIFF_PRESENT
      # gate below), the absence-reason file, and the generated report
      # JSON so reviewers can diagnose without re-running locally.
      - if: failure() && steps.cli_suites.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-failure-bundle
          path: |
            reports/i18n-allowlist-report.json
            reports/i18n-allowlist-summary.json
            reports/_ci/
            /tmp/i18n-cli-suite.log
          retention-days: 14
          if-no-files-found: warn
      # Verify the rendered step-summary markdown was actually written
      # so we surface a loud, actionable error if the rendering step
      # silently no-op'd (e.g. $GITHUB_STEP_SUMMARY unset, cp failed,
      # disk full). Runs on every CI invocation, not just failures.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        name: Verify rendered step-summary.md exists
        run: |
          if [ ! -s reports/_ci/step-summary.md ]; then
            echo "::error file=reports/_ci/step-summary.md::Expected rendered step-summary.md to exist after CLI suites step on ubuntu-latest, but the file is missing or empty. The failure-breakdown rendering step may have failed silently."
            exit 1
          fi
      # Validate the emitted failure-breakdown JSON against the expected
      # schemaVersion + required keys BEFORE uploading the artifact or
      # posting links in the PR comment, so reviewers never get a
      # malformed payload from a silently-broken renderer.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: validate_breakdown
        name: Validate failure-breakdown.json shape
        # `continue-on-error: true` so we can gate the downstream PR
        # comment on this step's outcome instead of failing the whole
        # workflow before reviewers see the artifacts. The gate below
        # still fails the job at the end if validation didn't pass.
        continue-on-error: true
        run: |
          bun run scripts/ci-validate-breakdown-json.ts reports/_ci/failure-breakdown.json \
            --summary-json reports/_ci/validate-summary.json
      # Upload the machine-readable validator summary JSON — only when
      # validation actually succeeded, so downstream consumers (PR bots,
      # dashboards) never ingest a summary describing a malformed payload.
      - if: steps.validate_breakdown.outcome == 'success' && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: upload_validate_summary_json
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-validate-summary-ubuntu-latest
          path: reports/_ci/validate-summary.json
          retention-days: 14
          if-no-files-found: warn
      # Per-OS step-summary artifact so reviewers can download the
      # rendered markdown directly (mirrors what GitHub displays in the
      # job UI). Uploaded on every run, not just failures.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: upload_step_summary_md
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-step-summary-ubuntu-latest
          path: reports/_ci/step-summary.md
          retention-days: 14
          if-no-files-found: warn
      # Machine-readable failure breakdown JSON — uploaded on every run
      # (green or red) so PR bots / dashboards can consume the same
      # parsed shape without having to re-parse the raw vitest log.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: upload_failure_breakdown_json
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-failure-breakdown-json-ubuntu-latest
          path: reports/_ci/failure-breakdown.json
          retention-days: 14
          if-no-files-found: warn
      # Single consolidated debug-bundle artifact — uploaded on every
      # run so reviewers can grab the rendered markdown, JSON breakdown,
      # and raw vitest log in one click without hunting through multiple
      # per-suite artifacts.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        id: upload_debug_bundle
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-debug-bundle-ubuntu-latest
          path: |
            reports/_ci/step-summary.md
            reports/_ci/failure-breakdown.json
            reports/_ci/failure-breakdown.md
            reports/_ci/i18n-cli-suite.log
          retention-days: 14
          if-no-files-found: warn
      # Append clickable artifact URLs to the rendered step-summary so
      # the markdown itself contains direct debug links (not just the
      # PR comment). Runs after all artifact uploads so we have IDs.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        name: Append artifact links to step-summary.md
        env:
          STEP_SUMMARY_ARTIFACT_ID: ${{ steps.upload_step_summary_md.outputs.artifact-id }}
          FAILURE_BREAKDOWN_ARTIFACT_ID: ${{ steps.upload_failure_breakdown_json.outputs.artifact-id }}
          DEBUG_BUNDLE_ARTIFACT_ID: ${{ steps.upload_debug_bundle.outputs.artifact-id }}
        # Idempotent + marker-pinned: the helper script renders the
        # EXACT begin/end markers that ci-strip-debug-links removes,
        # so reruns replace (never stack) the debug-links block.
        # Logic + markers are unit-tested in scripts/__tests__/
        # ci-append-debug-links.test.ts.
        run: |
          bun run scripts/ci-append-debug-links.ts reports/_ci/step-summary.md \
            --header "Debug artifacts" \
            --link id="${STEP_SUMMARY_ARTIFACT_ID:-}" label="📝 step-summary.md" \
            --link id="${FAILURE_BREAKDOWN_ARTIFACT_ID:-}" label="🧩 failure-breakdown.json" \
            --link id="${DEBUG_BUNDLE_ARTIFACT_ID:-}" label="📦 debug-bundle (all of the above + raw log)"

      # Coverage artifacts for the CLI suites, only on PRs.
      #   • lcov + text → tooling / inline review
      #   • html        → standalone browsable report for reviewers
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-coverage
          path: coverage/i18n-cli/
          retention-days: 14
          if-no-files-found: warn
      - if: always() && github.event_name == 'pull_request'
        id: upload_cli_coverage_html
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-coverage-html
          path: coverage/i18n-cli/
          retention-days: 14
          if-no-files-found: warn
      # Sticky PR comment with a one-click link to the HTML coverage
      # artifact — only posted/updated when the upload step actually
      # produced an artifact-id. When the upload was skipped or failed
      # (e.g. coverage dir empty), the comment is updated in-place with
      # a clear "report missing" message so reviewers aren't left with a
      # stale link from a previous run.
      - if: always() && github.event_name == 'pull_request'
        id: build_cli_coverage_comment
        name: Build CLI coverage PR comment
        env:
          COVERAGE_ARTIFACT_ID: ${{ steps.upload_cli_coverage_html.outputs.artifact-id }}
          STEP_SUMMARY_ARTIFACT_ID: ${{ steps.upload_step_summary_md.outputs.artifact-id }}
          FAILURE_BREAKDOWN_ARTIFACT_ID: ${{ steps.upload_failure_breakdown_json.outputs.artifact-id }}
          DEBUG_BUNDLE_ARTIFACT_ID: ${{ steps.upload_debug_bundle.outputs.artifact-id }}
          VALIDATE_OUTCOME: ${{ steps.validate_breakdown.outcome }}
        # Body + variants (success vs. validator-failed) are built by a
        # unit-tested helper so reviewers see the same suppression
        # behavior as scripts/__tests__/ci-build-coverage-pr-comment.test.ts
        # and ci-workflow-gating.test.ts pin. Note: the upload steps
        # above use `if: always()` so artifacts remain on the run page
        # even when the comment links are suppressed.
        run: |
          mkdir -p reports/_ci
          bun run scripts/ci-build-coverage-pr-comment.ts \
            --out reports/_ci/coverage-pr-comment.md
          echo "COVERAGE_COMMENT_READY=1" >> "$GITHUB_ENV"
      - if: always() && github.event_name == 'pull_request' && env.COVERAGE_COMMENT_READY == '1'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: i18n-cli-coverage
          path: reports/_ci/coverage-pr-comment.md
      # Duplicate-marker cleanup pass. Runs AFTER the sticky comment has
      # been posted so any stragglers from previous runs (manual pastes,
      # races that doubled-up the marker, comments older than the upsert
      # logic itself) are removed or tombstoned. cleanupStrategy /
      # head-scan window / debug logging are all configurable via the
      # workflow_dispatch inputs above, falling back to env defaults.
      # See docs/ci-sticky-pr-comment.md for the full matrix.
      - if: always() && github.event_name == 'pull_request' && env.COVERAGE_COMMENT_READY == '1'
        name: Sticky PR comment — duplicate cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STICKY_CLEANUP_STRATEGY: ${{ inputs.sticky_cleanup_strategy || 'delete' }}
          STICKY_HEAD_SCAN_LINES: ${{ inputs.sticky_head_scan_lines || '5' }}
          STICKY_DEBUG: ${{ inputs.sticky_debug || '0' }}
          STICKY_MARKER: '<!-- Sticky Pull Request Commenti18n-cli-coverage -->'
          STICKY_PR_NUMBER: ${{ github.event.pull_request.number }}
          STICKY_REPO: ${{ github.repository }}
        continue-on-error: true
        run: |
          bun run scripts/ci-sticky-pr-comment-upsert.ts \
            --marker "$STICKY_MARKER" \
            --body-file reports/_ci/coverage-pr-comment.md \
            --cleanup-strategy "$STICKY_CLEANUP_STRATEGY" \
            --head-scan-lines "$STICKY_HEAD_SCAN_LINES" \
            $( [ "$STICKY_DEBUG" = "1" ] && echo --debug )


      # Upload reports/ even when prior steps failed so the audit diff
      # (JSON + MD) is always available for inspection.
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        id: upload_i18n_report
        uses: actions/upload-artifact@v4
        with:
          name: i18n-report
          path: |
            reports/
            .lintrc-i18n-allowlist.json
          retention-days: 14
          if-no-files-found: warn
      # Concise PASS/FAIL summary printed to the job log AND the GitHub
      # step summary so reviewers / hooks see exactly what `bun run
      # i18n:allowlist:summary` would print locally. Uses --changed on
      # PRs (scoped to the diff) and the full report on push to main.
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: i18n allowlist concise summary (PASS/FAIL)
        id: allowlist_summary
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run i18n:allowlist:summary --changed | tee /tmp/i18n-summary.txt
          else
            bun run i18n:allowlist:summary | tee /tmp/i18n-summary.txt
          fi
          status=$?
          {
            echo '### i18n allowlist summary'
            echo '```'
            cat /tmp/i18n-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0  # never block here; final gate below enforces failure
      # GitHub annotations — surface the top offending file paths from
      # the concise failure reason as inline check annotations. The same
      # invocation also writes reports/i18n-allowlist-summary.json which
      # the Check Run step + artifact upload below consume.
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: i18n allowlist GitHub annotations + summary JSON
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run i18n:allowlist:summary --changed --annotations --json --topFiles 5 > /dev/null || true
          else
            bun run i18n:allowlist:summary --annotations --json --topFiles 5 > /dev/null || true
          fi
      # Standalone artifact upload so downstream tooling can fetch the
      # concise summary JSON without pulling the full i18n-report bundle.
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        id: upload_i18n_summary
        uses: actions/upload-artifact@v4
        with:
          name: i18n-allowlist-summary
          path: reports/i18n-allowlist-summary.json
          retention-days: 14
          if-no-files-found: warn
      # GitHub Check Run — re-uses the same annotations + links to the
      # uploaded allowlist report JSON artifact so the PR Checks tab shows
      # the identical one-line failure category and top file paths.
      # Skipped when the summary JSON's `publishCheckRun` field is false
      # (set via `--no-check-run` in earlier steps) — annotations and the
      # uploaded artifacts still ship in that case.
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: Publish i18n allowlist Check Run
        uses: actions/github-script@v7
        env:
          I18N_ARTIFACT_ID: ${{ steps.upload_i18n_report.outputs.artifact-id }}
        with:
          script: |
            const fs = require('fs');
            let summary;
            try {
              summary = JSON.parse(fs.readFileSync('reports/i18n-allowlist-summary.json', 'utf8'));
            } catch (e) {
              core.warning(`Skipping Check Run: ${e.message}`);
              return;
            }
            if (summary.publishCheckRun === false) {
              core.info('Skipping Check Run: summary.publishCheckRun=false (--no-check-run)');
              return;
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const artifactUrl = process.env.I18N_ARTIFACT_ID
              ? `${runUrl}/artifacts/${process.env.I18N_ARTIFACT_ID}`
              : `${runUrl}#artifacts`;
            const topFiles = summary.failure?.topFiles ?? [];
            const topMessages = summary.failure?.topMessages ?? [];
            const annotations = topFiles.map((entry, i) => {
              const m = entry.match(/^(.*):(\d+)$/);
              const path = m ? m[1] : entry;
              const line = m ? Number(m[2]) : 1;
              // Schema annotations carry the specific schema error
              // message; drift falls back to the aggregate reason.
              const specific = topMessages[i];
              const message =
                summary.failure.category === 'schema' && specific
                  ? `${summary.failure.reason} — ${specific}`
                  : summary.failure.reason;
              return {
                path,
                start_line: line,
                end_line: line,
                annotation_level: 'failure',
                message,
                title: `i18n allowlist — ${summary.failure.category}`,
              };
            });
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'i18n allowlist',
              head_sha: context.payload.pull_request?.head.sha ?? context.sha,
              status: 'completed',
              conclusion: summary.ok ? 'success' : 'failure',
              details_url: artifactUrl,
              output: {
                title: summary.ok ? '✅ PASS' : `❌ FAIL — ${summary.failure?.category ?? 'unknown'}`,
                summary: [
                  summary.ok ? 'No drift detected.' : `**Reason:** ${summary.failure?.reason}`,
                  '',
                  `[📦 Download allowlist report bundle](${artifactUrl})`,
                  '',
                  '| Entries | Schema errors | Missing | Stale |',
                  '|---|---|---|---|',
                  `| ${summary.counts.entries} | ${summary.counts.schemaErrors} | ${summary.counts.missing} | ${summary.counts.stale} |`,
                ].join('\n'),
                annotations: annotations.slice(0, 50),
              },
            });
      # PR comment with direct links to the uploaded artifact + a short
      # pass/fail summary of the allowlist report so reviewers can grab the
      # audit diff / allowlist even on failed jobs.
      - if: always() && github.event_name == 'pull_request' && steps.changes.outputs.i18n == 'true'
        name: Build i18n PR comment body
        env:
          I18N_ARTIFACT_ID: ${{ steps.upload_i18n_report.outputs.artifact-id }}
          I18N_SUMMARY_ARTIFACT_ID: ${{ steps.upload_i18n_summary.outputs.artifact-id }}
        run: bun run i18n:allowlist:pr-comment > /dev/null
      - if: always() && github.event_name == 'pull_request' && steps.changes.outputs.i18n == 'true'
        name: Append concise summary to PR comment body
        run: |
          {
            echo ''
            echo '---'
            echo ''
            echo '<details><summary><b>Concise PASS/FAIL summary</b> (from <code>i18n:allowlist:summary --changed</code>)</summary>'
            echo ''
            echo '```'
            cat /tmp/i18n-summary.txt
            echo '```'
            echo ''
            echo '</details>'
          } >> reports/_i18n-allowlist-pr-comment.md
      - if: always() && github.event_name == 'pull_request' && steps.changes.outputs.i18n == 'true'
        name: Comment PR with i18n artifact links + summary
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: i18n-report
          path: reports/_i18n-allowlist-pr-comment.md
      # Final gates — run AFTER artifacts are uploaded and the PR comment
      # is posted so reviewers still get the reports even when a gate fails.
      - if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        name: Enforce breakdown-JSON validation gate
        run: |
          if [ "${{ steps.validate_breakdown.outcome }}" != "success" ]; then
            echo "::error::failure-breakdown.json validation failed — see the 'Validate failure-breakdown.json shape' step above. PR comment links were suppressed for this run."
            exit 1
          fi
      - if: always() && (steps.changes.outputs.i18n == 'true' || github.event_name == 'push')
        name: Enforce allowlist gate
        run: |
          if [ "${ALLOWLIST_FAILED:-0}" = "1" ]; then
            echo "::error::i18n allowlist validation failed — see reports/i18n-allowlist-report.md"
            exit 1
          fi





  e2e:
    # Real-browser Playwright tests across chromium, firefox & webkit.
    # Covers cross-tab storage sync, reload persistence, localized
    # Export/Help/Mode menus, shortcut hints, and toasts.
    name: Playwright E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base with origin/main for PR-scoped diffing in
          # scripts/e2e-run-changed-scenes.ts. Shallow=1 breaks it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      # PR mode: visual regression suite is scoped to scenes that changed
      # in this PR (safety-net specs — webgl-fallback + smoke — always run).
      # Push to main / workflow_dispatch / scheduled: full suite.
      - name: Run E2E on ${{ matrix.browser }} (PR-scoped)
        if: github.event_name == 'pull_request'
        run: bun run scripts/e2e-run-changed-scenes.ts --base origin/${{ github.base_ref }}
        env:
          CI: "1"
          PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
          E2E_TOAST_TIMEOUT_MS: "8000"
          E2E_TOAST_DISMISS_TIMEOUT_MS: "12000"
          E2E_TOAST_MIN_VISIBLE_MS: "250"
      - name: Run E2E on ${{ matrix.browser }} (full)
        if: github.event_name != 'pull_request'
        run: bunx playwright test --project=${{ matrix.browser }}
        env:
          CI: "1"
          PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
          E2E_TOAST_TIMEOUT_MS: "8000"
          E2E_TOAST_DISMISS_TIMEOUT_MS: "12000"
          E2E_TOAST_MIN_VISIBLE_MS: "250"
      # Upload the HTML report + raw test-results FIRST so we have an
      # artifact-id to deep-link from the summary table below.
      - id: upload_playwright_report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Per-browser manifest: enumerates every live-region-* file the
      # spec expects vs. what actually landed on disk under test-results/
      # for THIS matrix browser. Printed to the job log AND the summary
      # so `summary row's linked filename == real uploaded artifact`
      # can be verified at a glance.
      - name: Live-region artifact manifest (${{ matrix.browser }})
        if: always()
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -u
          echo "## 🗂 live-region artifact manifest — ${BROWSER}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| status | expected filename | actual path (test-results/) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          expected=(live-region-log.json live-region-innertext.txt dom-snapshot.html live-region-trace.zip live-region-failure.png)
          # Machine-readable manifest — consumed by downstream CI steps
          # (see `manifest-path` step output below). Schema:
          # { browser, generatedAt, files: [{ name, present, path|null }] }
          mkdir -p reports/_ci
          manifest="reports/_ci/live-region-manifest-${BROWSER}.json"
          printf '{\n  "browser": "%s",\n  "generatedAt": "%s",\n  "files": [\n' \
            "${BROWSER}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$manifest"
          n=${#expected[@]}; i=0
          for f in "${expected[@]}"; do
            i=$((i+1))
            hit=$(find test-results -type f -name "$f" 2>/dev/null | grep -i "${BROWSER}" | head -n1 || true)
            if [ -n "$hit" ]; then
              status="✅ present"
              rel="${hit#test-results/}"
              present="true"; path_json="\"$rel\""
            else
              status="⚠️ missing"
              rel="—"
              present="false"; path_json="null"
              # Surface each missing expected artifact as a GitHub Actions
              # `::warning::` so it lands in the run's annotations pane in
              # addition to the summary table below.
              echo "::warning title=live-region ${BROWSER} missing artifact::${f} (expected under test-results/*${BROWSER}*/${f})"
            fi
            echo "| $status | \`$f\` | \`$rel\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "[manifest ${BROWSER}] $status  $f  $rel"
            sep=","; [ "$i" = "$n" ] && sep=""
            printf '    {"name": "%s", "present": %s, "path": %s}%s\n' \
              "$f" "$present" "$path_json" "$sep" >> "$manifest"
          done
          echo "  ]" >> "$manifest"; echo "}" >> "$manifest"
          echo "manifest-path=$manifest" >> "$GITHUB_OUTPUT"
        id: live_region_manifest
      - name: Upload live-region manifest JSON (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-region-manifest-${{ matrix.browser }}
          path: reports/_ci/live-region-manifest-${{ matrix.browser }}.json
          if-no-files-found: warn
          retention-days: 14
      # Markdown failure summary (pixel-diff thresholds + direct links to
      # the HTML report artifact and per-failure debug bundles) so reviewers
      # can triage a red Playwright run without downloading anything first.
      - name: E2E failure summary (markdown + machine-readable JSON)
        if: always()
        env:
          REPORT_ARTIFACT_ID: ${{ steps.upload_playwright_report.outputs.artifact-id }}
          # Optional: when the repo mirrors `test-results/` to a public
          # location (GitHub Pages, S3, Vercel preview, etc.), set this
          # repo variable and the summary emits one-click trace.playwright.dev
          # links per failure instead of just the relative trace.zip path.
          PLAYWRIGHT_TRACE_BASE_URL: ${{ vars.PLAYWRIGHT_TRACE_BASE_URL }}
        run: |
          mkdir -p reports/_ci
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bun run scripts/ci-e2e-summary.ts test-results/e2e-results.json \
            --run-url "$RUN_URL" \
            --browser "${{ matrix.browser }}" \
            --report-artifact-id "${REPORT_ARTIFACT_ID:-}" \
            --debug-artifact-id "${REPORT_ARTIFACT_ID:-}" \
            --out reports/_ci/e2e-failure-summary.md \
            --json reports/_ci/e2e-failure-summary.json \
            || true
          cat reports/_ci/e2e-failure-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-failure-summary-${{ matrix.browser }}
          path: |
            reports/_ci/e2e-failure-summary.md
            reports/_ci/e2e-failure-summary.json
          retention-days: 14
          if-no-files-found: ignore


  e2e-live-region-verify:
    # Downloads every per-browser live-region-manifest-* JSON emitted by
    # the `e2e` matrix, combines them into a single manifest, and fails
    # the build when any expected trace.zip / screenshot filename is
    # missing for a matched browser (only enforced when that browser's
    # e2e leg actually failed — passing runs legitimately have no trace).
    name: Live-region artifact verify (combined)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: live-region-manifest-*
          path: _manifests
          merge-multiple: false
      - name: Combine + verify required artifacts
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -eu
          mkdir -p reports/_ci
          combined="reports/_ci/live-region-manifest-combined.json"
          # Merge every per-browser manifest into one JSON document.
          # Required artifacts (only enforced when e2e failed): trace.zip
          # and the failure screenshot for that browser.
          REQUIRED='["live-region-trace.zip","live-region-failure.png"]'
          node -e '
            const fs=require("fs"),path=require("path");
            const req=JSON.parse(process.env.REQUIRED);
            const root="_manifests";
            const browsers=[];
            for (const d of fs.existsSync(root)?fs.readdirSync(root):[]) {
              const f=path.join(root,d,`${d.replace(/^live-region-manifest-/,"live-region-manifest-")}.json`);
              // Artifact was uploaded with a single JSON file — just grab the first .json in the dir.
              const dir=path.join(root,d);
              const jf=fs.readdirSync(dir).find(x=>x.endsWith(".json"));
              if (!jf) continue;
              browsers.push(JSON.parse(fs.readFileSync(path.join(dir,jf),"utf8")));
            }
            const combined={generatedAt:new Date().toISOString(),required:req,browsers};
            fs.mkdirSync("reports/_ci",{recursive:true});
            fs.writeFileSync("reports/_ci/live-region-manifest-combined.json",JSON.stringify(combined,null,2));
            const enforce=process.env.E2E_RESULT==="failure";
            let bad=0;
            for (const b of browsers) {
              for (const name of req) {
                const entry=(b.files||[]).find(f=>f.name===name) || {name,present:false,path:null};
                const missing=!entry.present;
                if (!missing) continue;
                const level=enforce?"error":"warning";
                const entryJson=JSON.stringify(entry).replace(/,/g,"%2C").replace(/:/g,"%3A");
                // Annotation includes: browser, expected filename, and the
                // manifest entry ({name,present,path}) that triggered the miss.
                console.log(`::${level} title=live-region missing artifact [browser=${b.browser}] [expected=${name}]::browser=${b.browser} expected=${name} entry=${entryJson}`);
                if (enforce) bad++;
              }
            }
            console.log(`## 🧾 live-region combined manifest\n\nBrowsers: ${browsers.map(b=>b.browser).join(", ")||"(none)"}\nEnforced: ${enforce}\nFailures: ${bad}`);
            if (bad>0) { console.error(`FAIL: ${bad} browser(s) missing required trace.zip/screenshot artifacts`); process.exit(1); }
          '
      - name: Upload combined live-region manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-region-manifest-combined
          path: reports/_ci/live-region-manifest-combined.json
          if-no-files-found: ignore
          retention-days: 14


  i18n-cli-matrix:
    # Cross-platform sanity for the CLI truncation/parity tests across
    # Linux, macOS, and Windows runners. Confirms real path behavior
    # matches the buildSummary cross-platform expectations (backslash
    # normalization, ordering, --topFiles edge values) on every host.
    # Combos that need a POSIX `git` shim are skipped at runtime via
    # `it.skipIf(process.platform === 'win32')` so the Windows leg still
    # runs everything that doesn't depend on the shell shim.
    name: i18n CLI parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Split into two steps so a failure in one suite is isolated and
      # the other can be re-run independently. Each step appends its own
      # log slice and breakdown to the bundle.
      - name: Run CLI parity suite
        id: cli_parity
        shell: bash
        run: |
          set +e
          bunx vitest run \
            scripts/__tests__/i18n-allowlist-cli-parity.test.ts \
            2>&1 | tee /tmp/i18n-cli-parity.log
          status=${PIPESTATUS[0]}
          mkdir -p reports/_ci
          cp /tmp/i18n-cli-parity.log reports/_ci/i18n-cli-parity.log || true
          bun run scripts/ci-vitest-failure-summary.ts /tmp/i18n-cli-parity.log \
            --json reports/_ci/parity-breakdown.json \
            > reports/_ci/parity-breakdown.md || true
          {
            echo "### i18n CLI parity (${{ matrix.os }}) — failure breakdown"
            cat reports/_ci/parity-breakdown.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Run CLI flags suite
        id: cli_flags
        shell: bash
        # Run regardless of parity outcome so we get both reports in one CI run.
        if: always()
        run: |
          set +e
          bunx vitest run \
            scripts/__tests__/i18n-allowlist-cli-flags.test.ts \
            2>&1 | tee /tmp/i18n-cli-flags.log
          status=${PIPESTATUS[0]}
          mkdir -p reports/_ci
          cp /tmp/i18n-cli-flags.log reports/_ci/i18n-cli-flags.log || true
          bun run scripts/ci-vitest-failure-summary.ts /tmp/i18n-cli-flags.log \
            --json reports/_ci/flags-breakdown.json \
            > reports/_ci/flags-breakdown.md || true
          {
            echo "### i18n CLI flags (${{ matrix.os }}) — failure breakdown"
            cat reports/_ci/flags-breakdown.md
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$GITHUB_STEP_SUMMARY" reports/_ci/step-summary.md || true
          exit $status
      # Record whether the help-snapshot test actually produced a diff
      # file so the failure-bundle step can include it conditionally and
      # log a clear reason when it's missing instead of silently warning.
      - name: Record help-snapshot diff presence
        if: always()
        shell: bash
        run: |
          mkdir -p reports/_ci
          if [ -f reports/_ci/help-snapshot.diff ]; then
            echo "help-snapshot diff present on ${{ matrix.os }} (snapshot drift detected)" \
              > reports/_ci/help-snapshot.reason.txt
          else
            echo "help-snapshot diff not produced on ${{ matrix.os }} — --help output matched the committed snapshot, or the snapshot test did not run / failed before writing the diff." \
              > reports/_ci/help-snapshot.reason.txt
          fi
      # Verify the rendered step-summary markdown was actually written
      # on this OS, and fail loudly if not — catches silent rendering
      # regressions (e.g. $GITHUB_STEP_SUMMARY unset under a future
      # shell change) before they hide test failures.
      - if: always()
        name: Verify rendered step-summary.md exists
        shell: bash
        run: |
          if [ ! -s reports/_ci/step-summary.md ]; then
            echo "::error file=reports/_ci/step-summary.md::Expected rendered step-summary.md to exist on ${{ matrix.os }} after CLI flags step, but the file is missing or empty. The failure-breakdown rendering step may have failed silently."
            exit 1
          fi
      # Validate parity + flags breakdown JSONs against the expected
      # schemaVersion + required keys BEFORE uploading or linking, so
      # reviewers never land on a malformed payload from a silently-
      # broken renderer. `--allow-missing` because one suite may be
      # skipped on a given OS (e.g. POSIX-shim gated).
      - if: always()
        name: Validate parity + flags breakdown JSON shape
        shell: bash
        run: |
          bun run scripts/ci-validate-breakdown-json.ts \
            --allow-missing \
            reports/_ci/parity-breakdown.json \
            reports/_ci/flags-breakdown.json
      # Per-OS step-summary artifact: lets reviewers download the
      # rendered markdown directly (mirrors the GitHub job UI view).
      - if: always()
        id: upload_step_summary_md_matrix
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-step-summary-${{ matrix.os }}
          path: reports/_ci/step-summary.md
          retention-days: 14
          if-no-files-found: warn
      # Machine-readable parity + flags breakdown JSONs — uploaded on
      # every run (green or red) so dashboards / PR bots can consume the
      # parsed shape without re-parsing the raw vitest logs.
      - if: always()
        id: upload_failure_breakdown_json_matrix
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-failure-breakdown-json-${{ matrix.os }}
          path: |
            reports/_ci/parity-breakdown.json
            reports/_ci/flags-breakdown.json
          retention-days: 14
          if-no-files-found: warn
      # Single consolidated debug-bundle artifact — uploaded on every
      # run so reviewers can grab the rendered markdown, both JSON
      # breakdowns, and both raw vitest logs in one click.
      - if: always()
        id: upload_debug_bundle_matrix
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-debug-bundle-${{ matrix.os }}
          path: |
            reports/_ci/step-summary.md
            reports/_ci/parity-breakdown.json
            reports/_ci/flags-breakdown.json
            reports/_ci/parity-breakdown.md
            reports/_ci/flags-breakdown.md
            reports/_ci/i18n-cli-parity.log
            reports/_ci/i18n-cli-flags.log
          retention-days: 14
          if-no-files-found: warn
      # Append clickable artifact URLs to the rendered step-summary so
      # the markdown itself contains direct debug links for this OS.
      - if: always()
        name: Append artifact links to step-summary.md
        shell: bash
        env:
          STEP_SUMMARY_ARTIFACT_ID: ${{ steps.upload_step_summary_md_matrix.outputs.artifact-id }}
          FAILURE_BREAKDOWN_ARTIFACT_ID: ${{ steps.upload_failure_breakdown_json_matrix.outputs.artifact-id }}
          DEBUG_BUNDLE_ARTIFACT_ID: ${{ steps.upload_debug_bundle_matrix.outputs.artifact-id }}
        run: |
          bun run scripts/ci-append-debug-links.ts reports/_ci/step-summary.md \
            --header "Debug artifacts (${{ matrix.os }})" \
            --link id="${STEP_SUMMARY_ARTIFACT_ID:-}" label="📝 step-summary.md" \
            --link id="${FAILURE_BREAKDOWN_ARTIFACT_ID:-}" label="🧩 parity/flags breakdown JSON" \
            --link id="${DEBUG_BUNDLE_ARTIFACT_ID:-}" label="📦 debug-bundle (all of the above + raw logs)"
      - if: failure() && (steps.cli_parity.outcome == 'failure' || steps.cli_flags.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: i18n-cli-failure-bundle-${{ matrix.os }}
          # `reports/_ci/help-snapshot.diff` is only written by the
          # snapshot test when --help drifts. The whole `reports/_ci/`
          # directory upload picks it up when present; the absence is
          # always documented in `help-snapshot.reason.txt` written by
          # the preceding step, so reviewers always know *why* the diff
          # is or isn't in the bundle.
          path: |
            reports/i18n-allowlist-report.json
            reports/i18n-allowlist-summary.json
            reports/_ci/
            /tmp/i18n-cli-parity.log
            /tmp/i18n-cli-flags.log
          retention-days: 14
          if-no-files-found: warn


  install-prompt-a11y:
    # Dedicated axe-core a11y gate for the non-dismissible InstallPrompt
    # panel + its two install dialogs. Fails the build whenever a new
    # serious/critical accessibility violation appears that wasn't in the
    # baseline captured before the dialog is opened.
    name: InstallPrompt a11y (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ip:
              - 'src/components/note/InstallPrompt.tsx'
              - 'src/i18n/**'
              - 'e2e/install-prompt-*.spec.ts'
              - 'playwright.config.ts'
              - 'package.json'
              - 'bun.lockb'
      - if: steps.changes.outputs.ip == 'true' || github.event_name == 'push'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: steps.changes.outputs.ip == 'true' || github.event_name == 'push'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.ip == 'true' || github.event_name == 'push'
        run: bunx playwright install --with-deps chromium
      - if: steps.changes.outputs.ip == 'true' || github.event_name == 'push'
        name: Run InstallPrompt a11y specs (axe-core)
        id: ip_a11y
        # Glob picks up every install-prompt-*.spec.ts so newly added
        # specs are auto-included. Trace / video / screenshot are gated
        # to failure-only by playwright.config.ts (retain-on-failure /
        # only-on-failure), so green runs stay artifact-light while red
        # runs produce a full evidence bundle for flake diagnosis.
        # `--retries=2` re-runs failed tests up to 2 additional times to
        # absorb genuine environmental flakiness (WebKit font jitter,
        # CI-scheduler noise). Playwright still records trace/video/
        # screenshot on EACH failed attempt (playwright.config.ts uses
        # retain-on-failure / only-on-failure), so no evidence is lost —
        # per-attempt artifacts live under test-results/ and are uploaded
        # via the failure-evidence bundle below.
        run: |
          bunx playwright test \
            e2e/install-prompt-*.spec.ts \
            --reporter=line,html,json \
            --trace=retain-on-failure \
            --retries=2 \
            --output=test-results/install-prompt
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/install-prompt
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/install-prompt-results.json
          # Base URL for the focus-trap deep links in each JSON. Points
          # at the run-artifact HTTP base; the helper joins the test's
          # relative outputDir + filename onto this.
          IP_ARTIFACT_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts


      # Always upload the HTML report, JSON results, screenshots, traces
      # and videos when the install-prompt specs run — regardless of
      # outcome — so regressions are traceable from the workflow run
      # summary without re-running locally.
      - if: always() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: install-prompt-a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      # Dedicated failure-only bundle: screenshots + traces only, named
      # with the run attempt so retries don't clobber each other.
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: install-prompt-failure-evidence-attempt-${{ github.run_attempt }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/trace.zip
            test-results/**/*.json
            test-results/**/focus-trap-escape-*.json
          retention-days: 14
          if-no-files-found: warn

      # Build a single index JSON listing every focus-trap-escape-*.json
      # emitted this attempt, then bundle it alongside the raw files into
      # ONE downloadable artifact (upload-artifact@v4 = single .zip on
      # the run page). The index gives spec, browser, retry, and path
      # for fast navigation without unzipping to look around.
      - name: InstallPrompt — build focus-trap debug index
        if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        run: |
          mkdir -p reports/_ci
          OUT=reports/_ci/focus-trap-debug-index.json
          node -e '
            const fs=require("fs"), path=require("path");
            const walk=(d,acc=[])=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){
              const p=path.join(d,e.name);
              if(e.isDirectory())walk(p,acc);
              else if(/^focus-trap-escape-.*\.json$/.test(e.name))acc.push(p);
            }return acc;};
            const files=fs.existsSync("test-results")?walk("test-results"):[];
            const entries=files.map(f=>{
              const dir=path.basename(path.dirname(f));
              const proj=(dir.match(/(chromium|firefox|webkit)/)||[])[1]||null;
              const retry=Number((dir.match(/retry(\d+)/)||[0,0])[1]);
              const spec=dir.replace(/-(chromium|firefox|webkit)(-retry\d+)?$/,"");
              let payload=null; try{payload=JSON.parse(fs.readFileSync(f,"utf8"));}catch{}
              return {file:f, spec, browser:proj, retry, label:payload?.label??null, testTitle:payload?.testTitle??null};
            });
            fs.writeFileSync(process.env.OUT, JSON.stringify({
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT||1),
              generatedAt: new Date().toISOString(),
              count: entries.length,
              entries,
            }, null, 2));
            console.log(`Indexed ${entries.length} focus-trap JSON file(s) -> ${process.env.OUT}`);
          '
        env:
          OUT: reports/_ci/focus-trap-debug-index.json

      # Dedicated single-ZIP artifact: raw focus-trap JSONs + the index.
      # upload-artifact@v4 packages `path:` inputs into ONE downloadable
      # archive per artifact name, so this whole bundle downloads as
      # `install-prompt-focus-trap-debug-attempt-N.zip`.
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: install-prompt-focus-trap-debug-attempt-${{ github.run_attempt }}
          path: |
            test-results/**/focus-trap-escape-*.json
            reports/_ci/focus-trap-debug-index.json
          retention-days: 14
          if-no-files-found: ignore

      # Run the inspect script to produce a machine-readable summary +
      # CSV row-per-failure, then upload both alongside the raw JSONs
      # under the SAME base path used by IP_ARTIFACT_BASE_URL deep links
      # so the URLs in each focus-trap-escape JSON resolve inside this
      # artifact bundle.
      - name: InstallPrompt — inspect focus-trap artifacts
        if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        run: |
          bun run scripts/inspect-focus-trap.ts \
            --attempt ${{ github.run_attempt }} \
            --out reports/_ci/focus-trap-inspect-summary.json \
            --csv reports/_ci/focus-trap-inspect-summary.csv \
            --md  reports/_ci/focus-trap-inspect-summary.md || true
          # Also emit valid-only and invalid-only CSVs so downstream jobs
          # can ingest either slice without re-filtering the combined CSV.
          bun run scripts/inspect-focus-trap.ts \
            --attempt ${{ github.run_attempt }} \
            --out reports/_ci/focus-trap-inspect-summary.valid.json \
            --csv reports/_ci/focus-trap-inspect-summary.valid.csv \
            --csv-filter valid || true
          bun run scripts/inspect-focus-trap.ts \
            --attempt ${{ github.run_attempt }} \
            --out reports/_ci/focus-trap-inspect-summary.invalid.json \
            --csv reports/_ci/focus-trap-inspect-summary.invalid.csv \
            --json-report reports/_ci/focus-trap-inspect-report.json \
            --html-report reports/_ci/focus-trap-inspect-report.html \
            --html-top-n 10 \
            --artifact-valid-url   "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts" \
            --artifact-invalid-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts" \
            --top 5 \
            --csv-filter invalid || true

          if [ -f reports/_ci/focus-trap-inspect-summary.md ]; then
            cat reports/_ci/focus-trap-inspect-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Combined summary + raw artifacts (unchanged name for backward compat).
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: install-prompt-focus-trap-inspect-attempt-${{ github.run_attempt }}
          path: |
            reports/_ci/focus-trap-inspect-summary.json
            reports/_ci/focus-trap-inspect-summary.csv
            reports/_ci/focus-trap-inspect-summary.md
            reports/_ci/focus-trap-debug-index.json
            reports/_ci/focus-trap-invalid/**
            test-results/**/focus-trap-escape-*.json
            test-results/**/focus-trap-escape-*.png
            test-results/**/focus-trap-escape-*.html
          retention-days: 14
          if-no-files-found: ignore
      # Standalone valid/invalid CSVs uploaded under unique, comparable
      # names (sha + scan-root) so on-call can diff the same slice across
      # runs without unzipping the combined bundle.
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: focus-trap-inspect-valid--test-results--${{ github.sha }}--attempt-${{ github.run_attempt }}
          path: |
            reports/_ci/focus-trap-inspect-summary.valid.csv
            reports/_ci/focus-trap-inspect-summary.valid.json
          retention-days: 14
          if-no-files-found: ignore
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: focus-trap-inspect-invalid--test-results--${{ github.sha }}--attempt-${{ github.run_attempt }}
          path: |
            reports/_ci/focus-trap-inspect-summary.invalid.csv
            reports/_ci/focus-trap-inspect-summary.invalid.json
            reports/_ci/focus-trap-inspect-report.json
          retention-days: 14
          if-no-files-found: ignore
      # Quarantined invalid focus-trap JSONs (with sibling screenshots/HTML
      # copied by inspect-focus-trap.ts) — uploaded under the same
      # sha + scan-root naming as the valid/invalid CSVs so on-call can
      # correlate a bad artifact with its CSV row across runs.
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: focus-trap-quarantine--test-results--${{ github.sha }}--attempt-${{ github.run_attempt }}
          path: |
            reports/_ci/focus-trap-invalid/**
          retention-days: 14
          if-no-files-found: ignore
      # Standalone HTML triage report — same sha + scan-root naming as
      # the CSV artifacts so on-call can open it directly from the run.
      - if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: focus-trap-inspect-html--test-results--${{ github.sha }}--attempt-${{ github.run_attempt }}
          path: |
            reports/_ci/focus-trap-inspect-report.html
          retention-days: 14
          if-no-files-found: ignore












      # Print direct download links for every trace/video/screenshot
      # produced by failing install-prompt specs to the workflow run
      # summary. Reviewers can jump straight to evidence for a flaky
      # spec without hunting through the artifacts list.
      - name: InstallPrompt failure evidence — print links to summary
        if: failure() && (steps.changes.outputs.ip == 'true' || github.event_name == 'push')
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ARTIFACTS_URL="${RUN_URL}#artifacts"
          BUNDLE="install-prompt-failure-evidence-attempt-${{ github.run_attempt }}"
          {
            echo '### InstallPrompt failure evidence'
            echo ''
            echo "Workflow attempt **${{ github.run_attempt }}** — Playwright retried each failing test up to **2** additional times (\`--retries=2\`)."
            echo "Download the [\`${BUNDLE}\`](${ARTIFACTS_URL}) bundle or the full [\`install-prompt-a11y-report\`](${ARTIFACTS_URL})."
            echo ''
            # List every focus-trap debug JSON emitted this run. Playwright
            # writes them under test-results/<spec>-<project>[-retryN]/ so
            # the path itself encodes the browser + attempt index — no
            # searching needed to open the right artifact.
            FT_FILES=$(find test-results -type f -name 'focus-trap-escape-*.json' 2>/dev/null | sort)
            if [ -n "$FT_FILES" ]; then
              echo '#### Focus-trap debug JSON (per attempt / browser)'
              echo ''
              echo '| File | Browser | Attempt |'
              echo '| --- | --- | --- |'
              printf '%s\n' "$FT_FILES" | while read -r f; do
                dir=$(basename "$(dirname "$f")")
                proj=$(printf '%s' "$dir" | grep -oE '(chromium|firefox|webkit)' | head -1)
                att=$(printf '%s' "$dir" | grep -oE 'retry[0-9]+' | grep -oE '[0-9]+' | head -1)
                [ -z "$att" ] && att=0
                echo "| \`$f\` | ${proj:-?} | $att |"
              done
              echo ''
            fi
            echo ''

            # Per-test retry breakdown parsed from the Playwright JSON report.
            # Playwright records one entry per attempt in `test.results[]`, so
            # `retry` counts how many re-runs a spec needed before its final
            # status. This makes it obvious which specs are flaky vs. broken.
            RESULTS_JSON=test-results/install-prompt-results.json
            if [ -f "$RESULTS_JSON" ]; then
              echo '#### Per-test retry breakdown'
              echo ''
              echo '| Spec | Test | Attempts | Final status |'
              echo '|---|---|---:|---|'
              node -e '
                const fs = require("fs");
                const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const rows = [];
                const walk = (suite, file) => {
                  const f = file || suite.file || "";
                  for (const s of suite.suites || []) walk(s, f);
                  for (const spec of suite.specs || []) {
                    for (const t of spec.tests || []) {
                      const attempts = (t.results || []).length;
                      const last = (t.results || []).slice(-1)[0] || {};
                      const status = last.status || t.status || "unknown";
                      if (attempts > 1 || status !== "passed") {
                        rows.push({ file: f, name: spec.title, attempts, status });
                      }
                    }
                  }
                };
                for (const s of r.suites || []) walk(s);
                for (const row of rows) {
                  const badge = row.status === "passed" ? "✅ passed (flaky)" : `❌ ${row.status}`;
                  process.stdout.write(`| \`${row.file}\` | ${row.name} | ${row.attempts} | ${badge} |\n`);
                }
                if (rows.length === 0) process.stdout.write("| _(none)_ | | | _no retries or failures_ |\n");
              ' "$RESULTS_JSON"
              echo ''
            fi
            # Build a per-spec, per-attempt grouped view of artifact
            # files. Each spec file becomes a collapsible <details> block
            # showing, per Playwright retry attempt, the browser (project)
            # and the exact failing test title alongside its trace, video
            # and screenshot links. Driven by the Playwright JSON report
            # (test-results/install-prompt-results.json) so we get the
            # real test title + project instead of relying on directory
            # slugs.
            GROUPED_MD=$(mktemp)
            if [ -f "$RESULTS_JSON" ]; then
              ARTIFACTS_URL="$ARTIFACTS_URL" node -e '
                const fs = require("fs");
                let r = {};
                try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")) || {}; }
                catch (e) { console.error("[grouping] JSON parse failed:", e.message); }
                const url = process.env.ARTIFACTS_URL || "";
                // file -> attempt -> array of { project, title, status, items }
                const bySpec = new Map();
                const walk = (suite, file) => {
                  if (!suite || typeof suite !== "object") return;
                  const f = file || suite.file || "";
                  for (const s of suite.suites || []) walk(s, f);
                  for (const spec of suite.specs || []) {
                    if (!spec) continue;
                    for (const t of spec.tests || []) {
                      if (!t) continue;
                      const project = t.projectName || t.projectId || "unknown";
                      const results = Array.isArray(t.results) ? t.results : [];
                      results.forEach((res, i) => {
                        res = res || {};
                        const status = res.status || "unknown";
                        // Skip pure single-attempt passes with no attachments.
                        if (status === "passed" && results.length === 1) return;
                        const items = ((res.attachments || []))
                          .filter(a => a && a.path)
                          .map(a => {
                            const base = String(a.path).split(/[\\/]/).pop() || "artifact";
                            let kind = "artifact";
                            if (/\.png$/i.test(base)) kind = "screenshot";
                            else if (/\.webm$/i.test(base)) kind = "video";
                            else if (/trace(\.\w+)?\.zip$/i.test(base)) kind = "trace";
                            else if (a.name) kind = String(a.name);
                            // Name the on-disk artifact so it always encodes
                            // the exact retry attempt + browser, matching
                            // the collapsed section grouping.
                            const named = `${project}__attempt-${i}__${base}`;
                            return { kind, base, named };
                          });
                        if (!bySpec.has(f)) bySpec.set(f, new Map());
                        const byAtt = bySpec.get(f);
                        if (!byAtt.has(i)) byAtt.set(i, []);
                        byAtt.get(i).push({
                          project, title: spec.title || "(untitled)", status, items,
                        });
                      });
                    }
                  }
                };
                for (const s of r.suites || []) walk(s);
                const out = [];
                out.push("#### Per-spec artifact files (grouped by spec → Playwright retry attempt → browser · test)");
                out.push("");
                if (bySpec.size === 0) {
                  out.push("_No per-spec evidence files were produced._");
                } else {
                  for (const [file, byAtt] of [...bySpec.entries()].sort()) {
                    out.push(`<details><summary><code>${file || "(unknown spec file)"}</code></summary>`);
                    out.push("");
                    for (const att of [...byAtt.keys()].sort((a,b)=>a-b)) {
                      const label = att === 0 ? "attempt 0 (initial)" : `attempt ${att}`;
                      out.push(`**${label}**`);
                      out.push("");
                      for (const entry of byAtt.get(att)) {
                        const badge = entry.status === "passed" ? "✅ passed" : `❌ ${entry.status}`;
                        out.push(`- \`${entry.project}\` · **${entry.title}** — ${badge}`);
                        if (entry.items.length) {
                          out.push("");
                          out.push("  | Kind | File |");
                          out.push("  |---|---|");
                          for (const it of entry.items) {
                            out.push(`  | ${it.kind} | [\`${it.named}\`](${url}) |`);
                          }
                        } else {
                          // Fallback: no trace/video/screenshot paths were
                          // emitted (e.g. attachments field missing), but
                          // we still surface the failing spec + test name
                          // so reviewers know what broke.
                          out.push(`  _no artifact paths for this attempt — see HTML report_`);
                        }
                        out.push("");
                      }
                    }
                    out.push("</details>");
                    out.push("");
                  }
                }
                process.stdout.write(out.join("\n"));
              ' "$RESULTS_JSON" > "$GROUPED_MD"

            else
              echo '_No Playwright JSON report was produced; cannot group artifacts._' > "$GROUPED_MD"
            fi
            cat "$GROUPED_MD"
            mkdir -p reports/_ci
            cp "$GROUPED_MD" reports/_ci/install-prompt-grouped-artifacts.md
          } >> "$GITHUB_STEP_SUMMARY"

        env:
          ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      # Assemble the sticky PR comment body from a template + the
      # grouped artifact section, so the comment shows the collapsible
      # per-spec / per-attempt table inline (not just a link to the
      # workflow summary).
      - name: InstallPrompt failure evidence — build PR comment body
        if: failure() && github.event_name == 'pull_request' && (steps.changes.outputs.ip == 'true')
        run: |
          mkdir -p reports/_ci
          BODY=reports/_ci/install-prompt-pr-comment.md
          {
            echo "### InstallPrompt Playwright failures — workflow attempt ${{ github.run_attempt }}"
            echo ''
            echo 'Playwright ran with `--retries=2` (each failing test re-attempts up to 2 times).'
            echo 'The failure-evidence bundle contains **per-attempt** trace/video/screenshot files'
            echo '— not just the last attempt — so you can diff evidence across retries.'
            echo ''
            echo "Attached to [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts):"
            echo ''
            echo "- **Failure evidence** (per workflow attempt, contains all Playwright retry attempts): \`install-prompt-failure-evidence-attempt-${{ github.run_attempt }}\`"
            echo '- **Full HTML report**: `install-prompt-a11y-report`'
            echo ''
            if [ -f reports/_ci/install-prompt-grouped-artifacts.md ]; then
              cat reports/_ci/install-prompt-grouped-artifacts.md
            else
              echo '_(No grouped artifact section was produced for this run.)_'
            fi
            echo ''
            echo 'The workflow run **Summary** tab also has a per-test retry breakdown (attempts + final status).'
            echo ''
            echo 'Open the HTML report locally with:'
            echo '```'
            echo 'bunx playwright show-report playwright-report/install-prompt'
            echo '```'
          } > "$BODY"
      - name: InstallPrompt failure evidence — sticky PR comment
        if: failure() && github.event_name == 'pull_request' && (steps.changes.outputs.ip == 'true')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: install-prompt-failure-evidence
          path: reports/_ci/install-prompt-pr-comment.md

  # Contract check for scripts/inspect-focus-trap.ts:
  #   - synthesise a tiny fixture tree (1 healthy + 2 invalid artifacts)
  #     and a "previous run" CSV so --diff-with has something to compare;
  #   - run --report-validate-only  → must exit 0 AND write no artifacts;
  #   - run --diff-json-out         → must exit 2, write the JSON with a
  #     pinned schemaVersion + at least one changed row.
  # Any deviation (unexpected exit code, missing/extra file) fails the job.
  focus-trap-inspect-contract:
    name: focus-trap inspect · report-validate-only + diff-json-out fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Seed fixture
        run: |
          set -euo pipefail
          FX=/tmp/ft-fixture
          rm -rf "$FX"; mkdir -p "$FX/test-results/a-spec-chromium-retry0" \
                                  "$FX/test-results/b-spec-chromium-retry0" \
                                  "$FX/test-results/c-spec-chromium-retry0" \
                                  "$FX/prev" "$FX/out"
          echo '{"focusHistory":[{"event":"keydown"}]}' > "$FX/test-results/a-spec-chromium-retry0/focus-trap-escape-x.json"
          echo '{"focusHistory":[{"event":42}]}'         > "$FX/test-results/b-spec-chromium-retry0/focus-trap-escape-x.json"
          echo '{broken'                                  > "$FX/test-results/c-spec-chromium-retry0/focus-trap-escape-x.json"
          printf 'file,failureReason\n%s,\n' "$FX/test-results/a-spec-chromium-retry0/focus-trap-escape-x.json" \
            > "$FX/prev/focus-trap-inspect-summary.valid.csv"

      - name: --report-validate-only must exit 0 and write NO files under out/
        run: |
          set -euo pipefail
          FX=/tmp/ft-fixture
          bun run scripts/inspect-focus-trap.ts \
            --scan-root "$FX/test-results" \
            --out "$FX/out/summary.json" \
            --json-report "$FX/out/report.json" \
            --diff-with "$FX/prev" \
            --diff-out "$FX/out/diff.csv" \
            --diff-json-out "$FX/out/diff.json" \
            --html-report "$FX/out/report.html" \
            --invalid-dir "$FX/out/_invalid" \
            --report-validate-only
          # Exact-set assertion: NOT just per-file existence — the whole
          # out/ tree must be empty. Any surprise write (a new artifact
          # flag that forgot to honour --report-validate-only) fails here.
          actual="$(find "$FX/out" -mindepth 1 -printf '%P\n' | LC_ALL=C sort | tr '\n' ',' )"
          if [ -n "$actual" ]; then
            echo "unexpected files written under out/: $actual"; exit 1
          fi

      - name: --diff-json-out must exit 2, produce exact file set, validate against schema
        run: |
          set -euo pipefail
          FX=/tmp/ft-fixture
          set +e
          bun run scripts/inspect-focus-trap.ts \
            --scan-root "$FX/test-results" \
            --out "$FX/out/summary.json" \
            --diff-with "$FX/prev" \
            --diff-out "$FX/out/diff.csv" \
            --diff-json-out "$FX/out/diff.json" \
            --invalid-dir "$FX/out/_invalid"
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then echo "expected exit 2, got $rc"; exit 1; fi
          # Exact-set assertion for the artifacts this invocation should
          # produce. Directories under out/ (_invalid, dirname stubs) are
          # allowed; the set of *files* is pinned. Any extra file fails.
          expected="diff.csv
          diff.json
          summary.json"
          actual="$(find "$FX/out" -type f -not -path '*/_invalid/*' -printf '%P\n' | LC_ALL=C sort)"
          expected_sorted="$(printf '%s\n' $expected | LC_ALL=C sort)"
          if [ "$actual" != "$expected_sorted" ]; then
            echo "artifact set mismatch"; echo "expected:"; echo "$expected_sorted"; echo "actual:"; echo "$actual"; exit 1
          fi
          # Ajv-validate the diff JSON against the published schema so a
          # shape drift here fails CI, not the downstream consumer.
          bun add --dev ajv >/dev/null 2>&1 || true
          bun -e '
            const Ajv = require("ajv");
            const s = JSON.parse(require("fs").readFileSync("schemas/focus-trap-inspect-diff.schema.json", "utf8"));
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const v = new Ajv({ allErrors: true }).compile(s);
            if (!v(d)) { console.error(JSON.stringify(v.errors, null, 2)); process.exit(1); }
            const files = d.rows.map(r => r.file);
            if (JSON.stringify(files) !== JSON.stringify([...files].sort())) { console.error("rows not sorted"); process.exit(1); }
          ' "$FX/out/diff.json"

      # Preflight: fail fast (with a clear message) if the published
      # schema files referenced by the CLI + contract steps are missing
      # or unreadable before we run any Ajv validation against them.
      - name: Published JSON Schema files must exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            schemas/focus-trap-inspect-report.schema.json \
            schemas/focus-trap-inspect-diff.schema.json; do
            if [ ! -s "$f" ]; then echo "missing or empty schema: $f"; missing=1; continue; fi
            bun -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f" \
              || { echo "invalid JSON in schema: $f"; missing=1; }
            echo "OK $f"
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: --json-report must validate against the published schema
        run: |
          set -euo pipefail
          FX=/tmp/ft-fixture
          set +e
          bun run scripts/inspect-focus-trap.ts \
            --scan-root "$FX/test-results" \
            --out "$FX/out/summary.json" \
            --json-report "$FX/out/report.json" \
            --invalid-dir "$FX/out/_invalid"
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then echo "expected exit 2, got $rc"; exit 1; fi
          bun -e '
            const Ajv = require("ajv");
            const s = JSON.parse(require("fs").readFileSync("schemas/focus-trap-inspect-report.schema.json", "utf8"));
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const v = new Ajv({ allErrors: true }).compile(s);
            if (!v(d)) { console.error(JSON.stringify(v.errors, null, 2)); process.exit(1); }
          ' "$FX/out/report.json"

      # Guardrail: the CLI-emitted schemaVersion constants and the `const`
      # value pinned in each published JSON Schema must move together.
      # A drift here would silently invalidate every downstream consumer.
      - name: CLI schemaVersion must match published JSON Schemas
        run: |
          set -euo pipefail
          bun -e '
            const fs = require("fs");
            const src = fs.readFileSync("scripts/_helpers/focus-trap-inspect.ts", "utf8");
            const pick = (name) => {
              const m = src.match(new RegExp(`${name}\\s*=\\s*"([^"]+)"`));
              if (!m) throw new Error(`missing const ${name}`);
              return m[1];
            };
            const report = JSON.parse(fs.readFileSync("schemas/focus-trap-inspect-report.schema.json","utf8"));
            const diff   = JSON.parse(fs.readFileSync("schemas/focus-trap-inspect-diff.schema.json","utf8"));
            const cliReport = pick("JSON_REPORT_SCHEMA_VERSION");
            const cliDiff   = pick("DIFF_JSON_SCHEMA_VERSION");
            const schemaReport = report.properties.schemaVersion.const;
            const schemaDiff   = diff.properties.schemaVersion.const;
            const rows = [
              ["--json-report",   cliReport, schemaReport],
              ["--diff-json-out", cliDiff,   schemaDiff],
            ];
            let ok = true;
            for (const [name, cli, schema] of rows) {
              if (cli !== schema) { console.error(`schemaVersion drift: ${name} CLI=${cli} schema=${schema}`); ok = false; }
              else { console.log(`OK ${name} schemaVersion=${cli}`); }
            }
            if (!ok) process.exit(1);
          '

      # Negative case: a fixture with a wrong schemaVersion must be
      # rejected by Ajv against the published schema (const violation).
      # Belt-and-braces for the CLI's own validators.
      - name: Wrong schemaVersion fixture must fail Ajv validation
        run: |
          set -euo pipefail
          FX=/tmp/ft-fixture
          mkdir -p "$FX/wrong"
          cat > "$FX/wrong/report.json" <<'JSON'
          {
            "schemaVersion": "9.9.9",
            "generatedAt": "2026-07-04T00:00:00Z",
            "meta": {"gitSha": null, "scanRoot": "r", "argv": [], "timestamp": "t"},
            "scanned": 0, "matched": 0, "valid": 0, "invalid": 0,
            "artifacts": [], "issues": []
          }
          JSON
          set +e
          bun -e '
            const Ajv = require("ajv");
            const s = JSON.parse(require("fs").readFileSync("schemas/focus-trap-inspect-report.schema.json","utf8"));
            const d = JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            const v = new Ajv({ allErrors: true }).compile(s);
            if (v(d)) { console.error("expected failure but Ajv accepted wrong schemaVersion"); process.exit(0); }
            const constErr = (v.errors||[]).find(e => e.keyword==="const" && e.instancePath==="/schemaVersion");
            if (!constErr) { console.error("no const error on /schemaVersion:", JSON.stringify(v.errors)); process.exit(0); }
            const msg = "schemaVersion mismatch: received=" + d.schemaVersion + " expected=" + constErr.params.allowedValue;
            console.error(msg);
            process.exit(2);
          ' "$FX/wrong/report.json" 2> "$FX/wrong/err.log"
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then echo "wrong-schemaVersion fixture did not fail as expected (rc=$rc)"; cat "$FX/wrong/err.log"; exit 1; fi
          # Assert error message names BOTH the received and the expected
          # schemaVersion so on-call can triage from CI logs alone.
          grep -q 'received=9.9.9'  "$FX/wrong/err.log" || { echo "error missing received schemaVersion"; cat "$FX/wrong/err.log"; exit 1; }
          grep -q 'expected=1.0.0'  "$FX/wrong/err.log" || { echo "error missing expected schemaVersion"; cat "$FX/wrong/err.log"; exit 1; }

      # Regenerate the schema-derived .d.ts and fail if it differs from
      # the committed version — prevents silent drift between schemas/
      # and the types imported by code/tests. Uses the same npm script
      # invoked by the pre-commit hook so local and CI stay in lockstep.
      - name: Generated schema types must be up to date (schema:types:check)
        run: |
          set -euo pipefail
          bun run schema:types:check \
            || { echo "generated schema types drifted — run: bun run schema:types  (then commit scripts/_helpers/focus-trap-inspect-schema.types.gen.ts)"; exit 1; }


  # ────────────────────────────────────────────────────────────────────────
  # pretty-index-mismatch-ci-selftest-all — fresh-checkout parity check.
  # On push (main / schedule / manual) both scopes always run. On PRs, each
  # scope only runs when its fixture-relevant paths changed, so unrelated
  # PRs stay fast while touching Makefile / pi-ci fixtures still enforces
  # parity.
  # ────────────────────────────────────────────────────────────────────────
  pretty-index-mismatch-ci-selftest:
    name: pretty-index-mismatch-ci-selftest-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect fixture-relevant changes
        id: filter
        shell: bash
        run: |
          set -e
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "atomic=true" >> "$GITHUB_OUTPUT"
            echo "stress=true" >> "$GITHUB_OUTPUT"
            echo "any=true"    >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head" || true)
          echo "── changed files ──"; echo "$changed" | sed 's/^/  /'
          atomic=false; stress=false
          # A change to shared infra (Makefile / workflow) re-runs BOTH
          # scopes; per-scope fixture directories only re-run their scope.
          echo "$changed" | grep -Eq '^(Makefile|\.github/workflows/ci\.yml|tests/fixtures/pretty-index/atomic/)' && atomic=true
          echo "$changed" | grep -Eq '^(Makefile|\.github/workflows/ci\.yml|tests/fixtures/pretty-index/stress/)' && stress=true
          any=false; { $atomic || $stress; } && any=true
          echo "atomic=$atomic" >> "$GITHUB_OUTPUT"
          echo "stress=$stress" >> "$GITHUB_OUTPUT"
          echo "any=$any"       >> "$GITHUB_OUTPUT"
      - name: run selftest (atomic)
        if: steps.filter.outputs.atomic == 'true'
        run: |
          make -s pretty-index-mismatch-ci-selftest \
            PI_CI_SELFTEST_SCOPE=atomic \
            PI_CI_SELFTEST_DIR=_pi-ci-selftest-atomic
      - name: verify selftest tarball (atomic)
        if: steps.filter.outputs.atomic == 'true'
        run: |
          make -s pretty-index-ci-tarball-verify \
            PI_CI_TARBALL=_pi-ci-selftest-atomic/bundle.tar.gz \
            PI_CI_TARBALL_ROOT=out
      - name: run selftest (stress)
        if: steps.filter.outputs.stress == 'true'
        run: |
          make -s pretty-index-mismatch-ci-selftest \
            PI_CI_SELFTEST_SCOPE=stress \
            PI_CI_SELFTEST_DIR=_pi-ci-selftest-stress
      - name: verify selftest tarball (stress)
        if: steps.filter.outputs.stress == 'true'
        run: |
          make -s pretty-index-ci-tarball-verify \
            PI_CI_TARBALL=_pi-ci-selftest-stress/bundle.tar.gz \
            PI_CI_TARBALL_ROOT=out
      - name: skip note
        if: steps.filter.outputs.any != 'true'
        run: echo "no fixture-relevant changes; skipping pretty-index-mismatch-ci-selftest-all"

