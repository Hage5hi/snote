      - name: Sticky artifacts — validate manifest + emit summary
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          bun run scripts/ci-sticky-validate-artifacts-manifest.ts \
