name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build:check

  i18n:
    # Coverage gate + focused i18n unit suite. Fails when any language drops
    # below 100% key coverage or has placeholder mismatches against English.
    name: i18n coverage · IP fallback · storage sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            i18n:
              - 'src/i18n/**'
              - 'scripts/i18n-coverage.ts'
              - 'src/components/LanguageToggle.tsx'
              - 'src/components/note/topbar/**'
              - 'src/components/note/*.tsx'
              - 'src/pages/Home.tsx'
              - 'src/App.tsx'
              - 'e2e/**'
              - 'playwright.config.ts'
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        name: i18n coverage gate
        run: bun run i18n:check
      - if: steps.changes.outputs.i18n == 'true' || github.event_name == 'push'
        name: Focused i18n vitest suite
        run: bunx vitest run src/i18n/__tests__/

  e2e:
    # Real-browser Playwright tests across chromium, firefox & webkit.
    # Covers cross-tab storage sync, reload persistence, localized
    # Export/Help/Mode menus, shortcut hints, and toasts.
    name: Playwright E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E on ${{ matrix.browser }}
        run: bunx playwright test --project=${{ matrix.browser }}
        env:
          CI: "1"
          PLAYWRIGHT_PROJECT: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
