name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly stress run for schema-drift-diff --json-out concurrency
    # (see schema-drift-diff-stress-nightly job below).
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      sticky_cleanup_strategy:
        description: 'Sticky PR comment duplicate-cleanup strategy: delete (default) or lock'
        required: false
        default: 'delete'
        type: choice
        options:
          - delete
          - lock
      sticky_head_scan_lines:
        description: 'Lines per comment to scan for the sticky marker (fast path). Default 5.'
        required: false
        default: '5'
      sticky_debug:
        description: 'Print which sticky comment was selected and cleanup actions taken (1=on).'
        required: false
        default: '0'


jobs:
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun run test
      # Dedicated visibility for the schema-drift-view.sh CLI unit tests
      # so a failure in flag parsing / --dry-run / --file / --viewer /
      # --browsers surfaces as its own red check on every PR (and blocks
      # merge) instead of hiding inside the aggregate `bun run test` line.
      - name: schema-drift-view.sh unit tests
        if: always()
        run: bunx vitest run scripts/__tests__/schema-drift-view.test.ts scripts/__tests__/schema-drift-pr-comment.test.ts --reporter=verbose
      # Fixture-based end-to-end check for --validate-manifest --strict-manifest:
      # generates a known-good per-browser + combined manifest via the script
      # itself, then re-validates them in strict mode and asserts the JSON
      # validation report shows zero failures. Any regression in the emitter
      # OR the validator surfaces here as its own red check.
      - name: schema-drift-view.sh --strict-manifest (fixture)
        if: always()
        env:
          # Default-on in CI: any diff/viewer step is gated on strict validation.
          SCHEMA_DRIFT_REQUIRE_VALID: '1'
        run: |
          set -eu
          fx=reports/_ci/schema-drift-fixture
          mkdir -p "$fx"
          bash scripts/schema-drift-view.sh --dry-run \
            --manifest-dir "$fx" --manifest-prefix drift \
            --browsers chromium,firefox,webkit \
            --require live-region-trace.zip,live-region-failure.png \
            --combined-manifest
          bash scripts/schema-drift-view.sh \
            --manifest-dir "$fx" --manifest-prefix drift \
            --strict-manifest \
            --validation-report "$fx/validation-report.json"
          # Belt-and-braces: assert the report reflects zero invalid files.
          node -e '
            const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            if (r.totals.invalid!==0) { console.error("expected 0 invalid, got "+r.totals.invalid); process.exit(1); }
            if (!r.strict) { console.error("expected strict=true"); process.exit(1); }
            console.log("fixture strict validation OK — checked="+r.totals.checked);
          ' "$fx/validation-report.json"
      - name: schema-drift-view.sh validation annotations
        if: always()
        env:
          # Tunable caps so reviewers can dial annotation volume up/down
          # without editing the workflow. All values are integers; unset
          # or non-numeric falls back to the defaults below.
          SCHEMA_DRIFT_ANNOTATION_MAX:   ${{ vars.SCHEMA_DRIFT_ANNOTATION_MAX   || '10' }}
          SCHEMA_DRIFT_MISSING_CAP:      ${{ vars.SCHEMA_DRIFT_MISSING_CAP      || '20' }}
          SCHEMA_DRIFT_MISTYPED_CAP:     ${{ vars.SCHEMA_DRIFT_MISTYPED_CAP     || '20' }}
          SCHEMA_DRIFT_EXTRA_CAP:        ${{ vars.SCHEMA_DRIFT_EXTRA_CAP        || '20' }}
        run: |
          set -eu
          report=reports/_ci/schema-drift-fixture/validation-report.json
          [ -f "$report" ] || { echo "no validation report; skipping annotations"; exit 0; }
          out=reports/_ci/schema-drift-fixture
          # Generate pr-comment.md (with stable per-row anchors) and a
          # separate annotations file listing each selected top failure
          # with kind + a #fail-<slug> anchor into pr-comment.md. Using
          # the same local script the debug docs point at keeps CI and
          # `bun scripts/schema-drift-pr-comment.ts` byte-for-byte
          # identical (see the reproducibility diff step below).
          run_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bun scripts/schema-drift-pr-comment.ts "$report" \
            --out "$out/pr-comment.md" \
            --annotations-file "$out/annotations.txt" \
            --comment-url "$run_url"
          # Cat the annotations file so each ::error:: line becomes a real
          # GitHub Actions annotation in the run's annotations pane.
          [ -s "$out/annotations.txt" ] && cat "$out/annotations.txt" || true
          # Emit a single roll-up ::warning:: summary so the run banner
          # shows counts even when the row-level annotations are collapsed.
          node -e '
            const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
            if (r.totals.invalid>0) console.log(`::warning::schema-drift manifests: ${r.totals.invalid}/${r.totals.checked} invalid (strict=${r.strict})`);
            else                    console.log(`::notice::schema-drift manifests: all ${r.totals.checked} valid`);
          ' "$report"
      # Job summary: append the same PR-comment body (top strict-validation
      # failures) to $GITHUB_STEP_SUMMARY so the failures are visible on the
      # run's Summary tab without downloading the artifact or opening a PR.
      - name: schema-drift-view.sh validation job summary
        if: always()
        run: |
          set -eu
          body=reports/_ci/schema-drift-fixture/pr-comment.md
          [ -f "$body" ] || { echo "no pr-comment.md; skipping job summary"; exit 0; }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo ""
            cat "$body"
            echo ""
            echo "#### Download artifacts"
            echo ""
            echo "| Artifact name | Contents | Download |"
            echo "|---|---|---|"
            echo "| \`schema-drift-pr-comment\`         | \`pr-comment.md\`         | [open run]($run_url#artifacts) |"
            echo "| \`schema-drift-annotations\`        | \`annotations.txt\`       | [open run]($run_url#artifacts) |"
            echo "| \`schema-drift-fixture-validation\` | full fixture folder + \`validation-report.json\` | [open run]($run_url#artifacts) |"
            echo ""
            echo "CLI: \`gh run download ${GITHUB_RUN_ID} -n schema-drift-pr-comment\` (see docs/schema-drift-ci-artifacts.md)."
          } >> "$GITHUB_STEP_SUMMARY"
      # Reproducibility check: the local `schema-drift-pr-comment.ts`
      # generator MUST produce the same Markdown body that the CI
      # annotation step wrote to pr-comment.md. If they diverge, the
      # local debugging command has drifted from CI and any offline
      # repro will lie — fail loudly so it gets fixed immediately.
      - name: schema-drift pr-comment reproducibility check
        if: always()
        run: |
          set -eu
          report=reports/_ci/schema-drift-fixture/validation-report.json
          expected=reports/_ci/schema-drift-fixture/pr-comment.md
          [ -f "$report" ] && [ -f "$expected" ] || { echo "no report/comment; skipping"; exit 0; }
          bun scripts/schema-drift-pr-comment.ts "$report" --out /tmp/pr-comment-local.md
          diff -u "$expected" /tmp/pr-comment-local.md
      # Always upload the fixture manifests + validation-report.json +
      # generated PR-comment markdown, even on failure, so reviewers can
      # download the exact inputs that triggered the annotations above.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-drift-fixture-validation
          path: |
            reports/_ci/schema-drift-fixture/
            reports/_ci/schema-drift-fixture/validation-report.json
            reports/_ci/schema-drift-fixture/pr-comment.md
            reports/_ci/schema-drift-fixture/annotations.txt
          if-no-files-found: ignore
          retention-days: 14
      # Standalone artifacts so reviewers can download pr-comment.md and
      # annotations.txt directly without pulling the whole fixture folder.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-drift-pr-comment
          path: reports/_ci/schema-drift-fixture/pr-comment.md
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-drift-annotations
          path: reports/_ci/schema-drift-fixture/annotations.txt
          if-no-files-found: ignore
          retention-days: 14
      # Post the generated Markdown body as a PR comment on pull_request
      # events. No-op on push/dispatch or when validation passed cleanly
      # (the comment file always exists but is a short ✅ line in that
      # case; posting it is still useful as a sticky success signal).
      - name: schema-drift-view.sh validation PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=reports/_ci/schema-drift-fixture/pr-comment.md
          [ -f "$body" ] || { echo "no pr-comment.md; skipping"; exit 0; }
          gh pr comment "$PR_NUMBER" -F "$body" || echo "gh pr comment failed (non-fatal)"


  # Cross-OS run of the schema-drift-diff --json-out atomic-write tests.
  # `renameSync` semantics (over-existing-file replacement, EACCES surface,
  # sibling `.tmp` cleanup) differ subtly between Linux and macOS; running
  # the same integration suite on both OSes guarantees a regression in
  # atomic-write handling on either platform blocks merge on its own.
  schema-drift-diff-atomic-crossos:
    name: schema-drift-diff --json-out atomic writes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: --print-schema + atomic --json-out tests
        # Use bash on every OS (including Windows) so the `\` line
        # continuations below are honored consistently.
        shell: bash
        # All knobs are optional repo-level variables. They mirror the local
        # env vars documented in docs/schema-drift-diff-test-hooks.md so a
        # contributor can copy the block from a failed CI run and reproduce
        # locally byte-for-byte.
        env:
          SCHEMA_DRIFT_DIFF_FUZZ_SEED: ${{ vars.SCHEMA_DRIFT_DIFF_FUZZ_SEED }}
          SCHEMA_DRIFT_DIFF_READER_DURATION_MS: ${{ vars.SCHEMA_DRIFT_DIFF_READER_DURATION_MS }}
          SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN: ${{ vars.SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN }}
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS: ${{ vars.SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS }}
        # Default test filter picks up:
        #   - print-schema
        #   - atomic write failure modes
        #   - long destination path
        #   - spaces and special characters
        #   - symlink + schema + cleanup wording
        #   - concurrent reader + fuzz + unsafe symlink
        run: |
          mkdir -p artifacts/schema-drift-diff
          DEFAULT_PATTERN='print-schema|atomic write failure modes|long destination path|spaces and special characters|symlink \+ schema \+ cleanup wording|concurrent reader \+ fuzz \+ unsafe symlink'
          PATTERN="${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-$DEFAULT_PATTERN}"
          TIMEOUT_MS="${SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS:-30000}"
          bunx vitest run scripts/__tests__/schema-drift-pr-comment.test.ts \
            -t "$PATTERN" \
            --testTimeout="$TIMEOUT_MS" \
            --reporter=verbose \
            > >(tee artifacts/schema-drift-diff/vitest.stdout.log) \
            2> >(tee artifacts/schema-drift-diff/vitest.stderr.log >&2)
      # Single, clearly labeled reproduction block: emitted on failure or
      # cancellation so the seed + reader duration + filter + timeout show
      # up in one place in the job log, not scattered across steps.
      - name: print replay block on failure
        if: failure() || cancelled()
        shell: bash
        run: |
          SEED="$(grep -oE 'SCHEMA_DRIFT_DIFF_FUZZ_SEED=[0-9]+' artifacts/schema-drift-diff/vitest.stderr.log 2>/dev/null | tail -n1 | cut -d= -f2)"
          SEED="${SEED:-${SCHEMA_DRIFT_DIFF_FUZZ_SEED:-<unset>}}"
          echo "::group::schema-drift-diff replay block (copy verbatim)"
          cat <<EOF
          # ---- schema-drift-diff --json-out replay block ----
          SCHEMA_DRIFT_DIFF_FUZZ_SEED=${SEED}
          SCHEMA_DRIFT_DIFF_READER_DURATION_MS=${SCHEMA_DRIFT_DIFF_READER_DURATION_MS:-300}
          SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN=${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-concurrent reader \+ fuzz \+ unsafe symlink}
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS=${SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS:-30000}

          # Local reproduction:
          scripts/replay-schema-drift-diff-fuzz.sh ${SEED} ${SCHEMA_DRIFT_DIFF_READER_DURATION_MS:-300} "${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-concurrent reader \+ fuzz \+ unsafe symlink}"
          # ---------------------------------------------------
          EOF
          echo "::endgroup::"
      - name: capture failing --json-out destinations
        if: failure() || cancelled()
        shell: bash
        run: |
          mkdir -p artifacts/schema-drift-diff/dest-snapshot
          # List every schema-drift-report-* tmp dir the tests created and
          # copy any surviving .tmp siblings + regular files under it.
          {
            find "${TMPDIR:-/tmp}" -maxdepth 3 -name 'schema-drift-report-*' -print 2>/dev/null || true
            find "${RUNNER_TEMP:-/tmp}" -maxdepth 3 -name 'schema-drift-report-*' -print 2>/dev/null || true
          } | sort -u | tee artifacts/schema-drift-diff/dest-listing.txt | while read -r d; do
            [ -d "$d" ] || continue
            base="artifacts/schema-drift-diff/dest-snapshot/$(basename "$d")"
            mkdir -p "$base"
            cp -a "$d"/. "$base"/ 2>/dev/null || true
          done
      # Kick off the replay helper so the timestamped folder
      # (manifest + env.sh + checksums) is materialized inside the workspace.
      # Uses --dry-run here so vitest is NOT invoked yet — we only want the
      # folder + integrity artifacts written to disk. Runs on success too so
      # the verify log + replay-summary.json are uploaded on every run.
      - name: prepare replay folder (dry-run materialize)
        id: prepare-replay
        if: always()
        shell: bash
        run: |
          SEED="$(grep -oE 'SCHEMA_DRIFT_DIFF_FUZZ_SEED=[0-9]+' artifacts/schema-drift-diff/vitest.stderr.log 2>/dev/null | tail -n1 | cut -d= -f2)"
          SEED="${SEED:-${SCHEMA_DRIFT_DIFF_FUZZ_SEED:-0}}"
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS="${SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS:-30000}" \
            scripts/replay-schema-drift-diff-fuzz.sh \
              "$SEED" \
              "${SCHEMA_DRIFT_DIFF_READER_DURATION_MS:-300}" \
              "${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-concurrent reader \+ fuzz \+ unsafe symlink}" \
              --dry-run
          FOLDER="$(ls -dt artifacts/schema-drift-diff-replay/*/ 2>/dev/null | head -n1)"
          echo "folder=${FOLDER%/}" >> "$GITHUB_OUTPUT"
      # Fail early on failure if the just-materialized folder is missing files
      # or its checksums don't verify. On success we still write the verify
      # log for upload but don't fail the job.
      - name: dry-run verify replay folder integrity
        if: always() && steps.prepare-replay.outputs.folder != ''
        shell: bash
        run: |
          mkdir -p artifacts/schema-drift-diff-replay-verify
          LOG="artifacts/schema-drift-diff-replay-verify/dry-run-verify.log"
          set +e
          scripts/replay-schema-drift-diff-fuzz.sh \
            --from "${{ steps.prepare-replay.outputs.folder }}" \
            --dry-run --verbose --json-summary 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          echo "$RC" > artifacts/schema-drift-diff-replay-verify/dry-run-verify.exit_code
          if [ "${{ job.status }}" = "success" ]; then exit 0; else exit "$RC"; fi

      # Now execute the real replay against the verified folder.
      # `|| true` because the replay is expected to also fail — we only
      # care about the postrun logs it writes.
      - name: materialize replay folder on failure (real replay)
        if: (failure() || cancelled()) && steps.prepare-replay.outputs.folder != ''
        shell: bash
        run: scripts/replay-schema-drift-diff-fuzz.sh --from "${{ steps.prepare-replay.outputs.folder }}" || true
      - name: upload --json-out debug artifacts
        id: upload-json-out
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-json-out-debug-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            artifacts/schema-drift-diff/vitest.stdout.log
            artifacts/schema-drift-diff/vitest.stderr.log
            artifacts/schema-drift-diff/dest-listing.txt
            artifacts/schema-drift-diff/dest-snapshot/**
            artifacts/schema-drift-diff-replay/**
      # Print an exact copy-paste replay command referencing the just-uploaded
      # artifact (name + manifest path + seed + reader duration + timeout),
      # AND append the same block + replay-summary.txt to the workflow
      # step summary so debuggers can find it without opening job logs.
      - name: print copy-paste replay command
        if: (failure() || cancelled()) && steps.upload-json-out.outcome == 'success'
        shell: bash
        run: |
          FOLDER="$(ls -dt artifacts/schema-drift-diff-replay/*/ 2>/dev/null | head -n1)"
          FOLDER="${FOLDER%/}"
          [ -n "$FOLDER" ] || { echo "no replay folder found — skipping"; exit 0; }
          REL="${FOLDER#artifacts/schema-drift-diff-replay/}"
          SEED="$(awk -F: '$1=="SCHEMA_DRIFT_DIFF_FUZZ_SEED"{sub(/^[^:]*:[ \t]*/,""); print; exit}' "$FOLDER/manifest.txt")"
          READER="$(awk -F: '$1=="SCHEMA_DRIFT_DIFF_READER_DURATION_MS"{sub(/^[^:]*:[ \t]*/,""); print; exit}' "$FOLDER/manifest.txt")"
          TIMEOUT="$(awk -F: '$1=="SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS"{sub(/^[^:]*:[ \t]*/,""); print; exit}' "$FOLDER/manifest.txt")"
          BLOCK=$(cat <<EOF
          # 1) Download the CI artifact:
          #    gh run download ${GITHUB_RUN_ID} -n schema-drift-diff-json-out-debug-${{ matrix.os }} -D ./replay-download
          #    (artifact contains: manifest.txt, env.sh, checksums.sha256, vitest.stdout/stderr.log)
          # 2) Replay from the manifest (checksum-verified):
          scripts/replay-schema-drift-diff-fuzz.sh --from ./replay-download/${REL}
          #
          # Or replay by seed/reader duration directly:
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS=${TIMEOUT} \\
            scripts/replay-schema-drift-diff-fuzz.sh ${SEED} ${READER} "concurrent reader \+ fuzz \+ unsafe symlink"
          #
          # manifest_path: ${FOLDER}/manifest.txt
          # env_context:   ${FOLDER}/env.sh
          # seed:          ${SEED}
          # reader_ms:     ${READER}
          # timeout_ms:    ${TIMEOUT}
          EOF
          )
          mkdir -p artifacts/schema-drift-diff-replay-verify
          printf '%s\n' "$BLOCK" > artifacts/schema-drift-diff-replay-verify/replay-command.sh
          chmod +x artifacts/schema-drift-diff-replay-verify/replay-command.sh || true
          echo "::group::schema-drift-diff copy-paste replay command"
          printf '%s\n' "$BLOCK"
          echo "::endgroup::"
          {
            echo '### schema-drift-diff --json-out replay (copy-paste)'
            echo ''
            echo '```bash'
            printf '%s\n' "$BLOCK"
            echo '```'
            if [ -r "$FOLDER/replay-summary.txt" ]; then
              echo ''
              echo '<details><summary>replay-summary.txt</summary>'
              echo ''
              echo '```'
              cat "$FOLDER/replay-summary.txt"
              echo '```'
              echo ''
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Separate, easy-to-find artifact holding ONLY the dry-run verification
      # log + labeled copy-paste replay command + replay-summary.json so
      # debuggers can `gh run download` this one artifact without pulling
      # the full debug bundle. Uploaded on success AND failure.
      #
      # Retention: 14 days (GitHub Actions default is 90; we cap to 14 to
      # keep the artifact list scannable). Successful-run copies exist so
      # you can compare a green run's replay-summary.json against a red
      # run's without re-running the workflow. Find them under
      # Actions → the workflow run → the "Artifacts" section at the top
      # of the run page (or `gh run view <id>` + `gh run download`).
      - name: upload dry-run verify + replay-command artifacts
        id: upload-verify
        if: always() && steps.prepare-replay.outputs.folder != ''
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-replay-verify-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/schema-drift-diff-replay-verify/dry-run-verify.log
            artifacts/schema-drift-diff-replay-verify/dry-run-verify.exit_code
            artifacts/schema-drift-diff-replay-verify/replay-command.sh
            artifacts/schema-drift-diff-replay/**/replay-summary.json
      - name: append verify artifact link to step summary
        if: always() && steps.upload-verify.outputs.artifact-url != ''
        shell: bash
        run: |
          {
            echo ''
            echo '#### schema-drift-diff replay verify artifacts (${{ matrix.os }})'
            echo ''
            echo "- [schema-drift-diff-replay-verify-${{ matrix.os }}](${{ steps.upload-verify.outputs.artifact-url }}) — contains \`dry-run-verify.log\`, \`replay-command.sh\`, and every \`replay-summary.json\`"
            echo "  - CLI: \`gh run download ${GITHUB_RUN_ID} -n schema-drift-diff-replay-verify-${{ matrix.os }}\`"
            echo "  - Retention: 14 days from this run. Uploaded on both success and failure so you can diff summaries across runs."
          } >> "$GITHUB_STEP_SUMMARY"
      # Pretty-print each replay-summary.json into the step summary so
      # debuggers can eyeball mode / exit_code / seed / fail_reason /
      # manifest_mapping without downloading the verify artifact.
      - name: append pretty replay-summary to step summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p artifacts/schema-drift-diff-replay-verify/pretty
          index="artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json"
          # Write the current v1 envelope shape ({schema_version, entries}).
          # Bump both this literal AND CURRENT_SCHEMA_VERSION in
          # scripts/validate-pretty-index.py together.
          echo '{"schema_version": 1, "entries": [' > "$index"
          first=1
          hard_fail=0
          count=0
          # Sort the input list so per-summary iteration (and therefore
          # the pretty-index.json entry order, the appended step-summary
          # blocks, and the link list below) is deterministic across
          # runners and OSes.
          for f in $(printf '%s\n' artifacts/schema-drift-diff-replay/*/replay-summary.json | LC_ALL=C sort); do
            [[ -f "$f" ]] || continue
            count=$((count + 1))

            base="$(basename "$(dirname "$f")")"
            reason="$(python3 -c "import json,sys
try:
  d=json.load(open(sys.argv[1]))
  r=d.get('fail_reason') or 'ok'
except Exception:
  r='unparseable'
print(r)" "$f" 2>/dev/null | tr -c '[:alnum:]._-' '_' | cut -c1-40)"
            reason="${reason:-ok}"
            exit_code="$(python3 -c "import json,sys
try:
  d=json.load(open(sys.argv[1]))
  print(d.get('exit_code') if d.get('exit_code') is not None else 'null')
except Exception:
  print('null')" "$f" 2>/dev/null)"
            out="artifacts/schema-drift-diff-replay-verify/pretty/${base}.${reason}.pretty.txt"
            md="artifacts/schema-drift-diff-replay-verify/pretty/${base}.${reason}.pretty.md"
            python3 scripts/pretty-replay-summary.py --fixed-widths --no-color "$f" > "$out" 2>&1
            rc=$?
            python3 scripts/pretty-replay-summary.py --fixed-widths --no-color --markdown "$f" > "$md" 2>&1 || true
            case "$rc" in
              0) status="ok" ;;
              3) status="schema-error"; hard_fail=1 ;;
              4) status="missing-file"; hard_fail=1 ;;
              5) status="unreadable";   hard_fail=1 ;;
              6) status="parse-error";  hard_fail=1 ;;
              *) status="exit=$rc";     hard_fail=1 ;;
            esac
            # Append to machine-readable triage index.
            [[ $first -eq 0 ]] && echo ',' >> "$index"
            first=0
            python3 -c "import json,sys
print(json.dumps({
  'folder': sys.argv[1],
  'summary_file': sys.argv[2],
  'pretty_txt': sys.argv[3],
  'pretty_md': sys.argv[4],
  'fail_reason': sys.argv[5],
  'exit_code': None if sys.argv[6] == 'null' else int(sys.argv[6]),
  'pretty_status': sys.argv[7],
  'pretty_exit_code': int(sys.argv[8]),
}, indent=2))" "$base" "$f" "$out" "$md" "$reason" "$exit_code" "$status" "$rc" >> "$index"
            {
              echo ''
              echo "<details><summary>pretty replay-summary: <code>${f}</code> — fail_reason=<code>${reason}</code> (${status})</summary>"
              echo ''
              if [[ "$rc" -eq 0 ]]; then
                # Render the Markdown table inline (not wrapped in ```)
                # so GitHub renders it as a real table.
                cat "$md"
              else
                echo '```'
                cat "$out" || echo "(pretty-print failed for $f)"
                echo '```'
              fi
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo ']}' >> "$index"
          # Snapshot the generator output BEFORE any migration so failure
          # uploads always include the exact bytes the validator saw.
          cp -- "$index" "${index}.pre-check.json"
          report="${index%.json}.report.json"
          # Single-entry-point drift + schema check via the shared local
          # script. --report writes the validator's machine-readable JSON
          # so the failure-upload step can attach it as an artifact.
          if ! val_err=$(scripts/check-pretty-index-local.sh --report "$report" "$index" 2>&1); then
            rc=$?
            first_line=$(printf '%s\n' "$val_err" | head -n1)
            echo "::error file=${index}::pretty-index.json check failed (exit ${rc}): ${first_line}" >&2
            {
              echo ''
              echo "### ❌ pretty-index.json schema validation failed"
              echo ''
              echo "- Path: \`${index}\`"
              echo "- Script exit: \`${rc}\` (1=drift, 3=schema, 4=missing)"
              echo ''
              echo '```'
              printf '%s\n' "$val_err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          
          # Per-matrix validated count so reviewers can see at a glance
          # how many replay-summary.json entries were pretty-printed
          # and validated on this runner.
          {
            echo ''
            echo "### ✅ pretty-index.json validated (${count} entr$( [[ $count -eq 1 ]] && echo y || echo ies ) on \`${{ matrix.os }}\`)"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$hard_fail" -ne 0 ]]; then
            echo "pretty-replay-summary.py returned a schema/file error (see step summary)" >&2
            exit 1
          fi

      - name: upload pretty replay-summary artifact
        id: upload-pretty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-replay-pretty-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/schema-drift-diff-replay-verify/pretty/*.pretty.txt
            artifacts/schema-drift-diff-replay-verify/pretty/*.pretty.md
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json
      - name: pretty-index-check diagnostics (MATRIX=atomic)
        if: failure()
        shell: bash
        run: |
          # Mirror `make pretty-index-check MATRIX=atomic` so the job log
          # names the exact artifact prefix that will be uploaded below.
          make -s pretty-index-diagnostics MATRIX=atomic || true
      - name: assert pretty-index failure diagnostics exist (MATRIX=atomic)
        if: failure()
        shell: bash
        run: |
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          missing=()
          for f in pretty-index.json pretty-index.pre-check.json pretty-index.report.json; do
            [[ -f "$DIR/$f" ]] || missing+=("$DIR/$f")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=pretty-index diagnostics missing (MATRIX=atomic)::expected artifact files not on disk: ${missing[*]}"
            echo "expected artifact name: schema-drift-diff-replay-pretty-index-failure-${{ matrix.os }}"
            exit 1
          fi
          echo "::notice title=pretty-index diagnostics present (MATRIX=atomic)::all 3 expected files found in $DIR"
      - name: compute pretty-index diagnostic checksums (MATRIX=atomic)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          ( cd "$DIR" && sha256sum \
              pretty-index.json \
              pretty-index.pre-check.json \
              pretty-index.report.json \
              > pretty-index.checksums.sha256 )
          echo "::group::pretty-index checksums (MATRIX=atomic)"
          cat "$DIR/pretty-index.checksums.sha256"
          echo "::endgroup::"
      - name: upload pretty-index failure diagnostics (MATRIX=atomic)
        id: upload-pretty-failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-replay-pretty-index-failure-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.pre-check.json
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.report.json
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.checksums.sha256
      - name: verify pretty-index diagnostic checksums (MATRIX=atomic)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          REPORT="/tmp/pi-mismatch-atomic.json"
          if ! ( cd "$DIR" && sha256sum -c pretty-index.checksums.sha256 ) > /tmp/pi-verify.log 2>&1; then
            echo "::group::pretty-index checksum MISMATCH (MATRIX=atomic)"
            cat /tmp/pi-verify.log
            echo ""
            echo "── expected (from pretty-index.checksums.sha256) ──"
            cat "$DIR/pretty-index.checksums.sha256"
            echo "── actual (recomputed now) ──"
            ( cd "$DIR" && sha256sum pretty-index.json pretty-index.pre-check.json pretty-index.report.json 2>/dev/null || true )
            echo "── per-file diff ──"
            first=1
            printf '{"schema":"pretty-index-checksum-mismatch/v1","scope":"atomic","matrix":"atomic","dir":"%s","results":[' "$DIR" > "$REPORT"
            while IFS= read -r line; do
              if [[ "$line" == *"FAILED"* || "$line" == *"OK"* ]]; then
                fname="${line%%:*}"
                exp=$(grep " $fname\$" "$DIR/pretty-index.checksums.sha256" | awk '{print $1}')
                act=$( ( cd "$DIR" && sha256sum "$fname" 2>/dev/null ) | awk '{print $1}')
                status=$([[ "$exp" == "$act" && -n "$exp" ]] && echo OK || echo MISMATCH)
                echo "  $fname  expected=${exp:-<none>}  actual=${act:-<missing>}  [$status]"
                [ $first -eq 1 ] || printf ',' >> "$REPORT"; first=0
                printf '{"file":"%s","expected":"%s","actual":"%s","status":"%s"}' \
                  "$fname" "$exp" "$act" "$status" >> "$REPORT"
              fi
            done < /tmp/pi-verify.log
            printf ']}\n' >> "$REPORT"
            echo ""
            echo "wrote machine-readable mismatch report: $REPORT"
            echo "::endgroup::"
            echo "::error title=pretty-index checksum mismatch (MATRIX=atomic)::one or more files under $DIR do not match their recorded sha256; see the group above and the uploaded pretty-index-checksum-mismatch-atomic-${{ matrix.os }} artifact"
            exit 1
          fi
          cat /tmp/pi-verify.log
          echo "::notice title=pretty-index checksums verified (MATRIX=atomic)::sha256sum -c passed for $DIR/pretty-index.checksums.sha256"

      - name: upload pretty-index checksum mismatch report (MATRIX=atomic)
        if: failure() && hashFiles('/tmp/pi-mismatch-atomic.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-checksum-mismatch-atomic-${{ matrix.os }}
          path: /tmp/pi-mismatch-atomic.json
          if-no-files-found: error
          retention-days: 14

      - name: build pretty-index mismatch summary JSON (MATRIX=atomic)
        if: failure() && hashFiles('/tmp/pi-mismatch-atomic.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          make -s pretty-index-mismatch-summary-json \
            PI_REPORT_PATH=/tmp/pi-mismatch-atomic.json \
            PI_SUMMARY_JSON_PATH=/tmp/pi-mismatch-summary-atomic.json
          echo "── summary (MATRIX=atomic) ──"
          cat /tmp/pi-mismatch-summary-atomic.json

      - name: validate pretty-index mismatch summary JSON (MATRIX=atomic)
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-atomic.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          make -s pretty-index-mismatch-summary-validate \
            PI_SUMMARY_JSON_PATH=/tmp/pi-mismatch-summary-atomic.json

      - name: render pretty-index mismatch summary markdown (MATRIX=atomic)
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-atomic.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          make -s pretty-index-mismatch-summary-md \
            PI_SUMMARY_JSON_PATH=/tmp/pi-mismatch-summary-atomic.json \
            PI_SUMMARY_MD_PATH=/tmp/pi-mismatch-summary-atomic.md

      - name: upload pretty-index mismatch summary JSON (MATRIX=atomic)
        id: upload-pi-summary-atomic
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-atomic.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-mismatch-summary-atomic-${{ matrix.os }}
          path: |
            /tmp/pi-mismatch-summary-atomic.json
            /tmp/pi-mismatch-summary-atomic.md
          if-no-files-found: error
          retention-days: 14

      - name: append pretty-index mismatch summary to step summary (MATRIX=atomic)
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-atomic.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          F=/tmp/pi-mismatch-summary-atomic.json
          URL="${{ steps.upload-pi-summary-atomic.outputs.artifact-url }}"
          {
            echo ""
            echo "### pretty-index mismatch summary (MATRIX=atomic, ${{ matrix.os }})"
            echo ""
            echo "| matrix | total | mismatched | missing |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.matrices | to_entries[] | "| \(.key) | \(.value.total) | \(.value.mismatched) | \(.value.missing) |"' -- "$F"
            jq -r '.totals   | "| **total** | \(.total) | \(.mismatched) | \(.missing) |"' -- "$F"
            echo ""
            if [ -n "$URL" ]; then
              echo "- [download \`pretty-index-mismatch-summary-atomic-${{ matrix.os }}.json\`]($URL)"
            else
              echo "- _summary.json artifact URL unavailable_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build pretty-index-mismatch-ci bundle (MATRIX=atomic)
        id: build-pi-ci-bundle-atomic
        if: failure() && hashFiles('/tmp/pi-mismatch-atomic.json') != ''
        shell: bash
        # continue-on-error so a non-3 exit from `pretty-index-mismatch-ci`
        # (e.g. validator failure) still lets the upload + step-summary
        # steps below run — the Makefile always tars the partial bundle.
        continue-on-error: true
        run: |
          set +e
          # Export the tarball path up-front so downstream steps reference
          # `steps.build-pi-ci-bundle-atomic.outputs.tarball` instead of
          # hardcoding a filename that might drift from the Makefile.
          TARBALL=/tmp/pi-ci-atomic.tar.gz
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          make -s pretty-index-mismatch-ci \
            PI_REPORT_PATH=/tmp/pi-mismatch-atomic.json \
            PI_CI_OUT_DIR=/tmp/pi-ci-atomic \
            PI_CI_BUNDLE_PATH="$TARBALL"
          rc=$?
          echo "pi_ci_rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ -f "$TARBALL" ]]; then
            sz=$(wc -c < "$TARBALL" | tr -d ' ')
            echo "tarball_exists=true"  >> "$GITHUB_OUTPUT"
            echo "tarball_bytes=$sz"    >> "$GITHUB_OUTPUT"
          else
            echo "tarball_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pretty-index-mismatch-ci (atomic)::tarball $TARBALL was not produced"
          fi
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "::warning title=pretty-index-mismatch-ci (atomic)::exited $rc; partial bundle will still be uploaded if present"
          fi

      - name: upload pretty-index-mismatch-ci bundle (MATRIX=atomic)
        id: upload-pi-ci-bundle-atomic
        if: always() && steps.build-pi-ci-bundle-atomic.outputs.tarball_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-mismatch-ci-bundle-atomic-${{ matrix.os }}
          path: ${{ steps.build-pi-ci-bundle-atomic.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14

      - name: link pretty-index-mismatch-ci bundle in step summary (MATRIX=atomic)
        if: always() && steps.upload-pi-ci-bundle-atomic.outputs.artifact-url != ''
        shell: bash
        run: |
          URL="${{ steps.upload-pi-ci-bundle-atomic.outputs.artifact-url }}"
          RC="${{ steps.build-pi-ci-bundle-atomic.outputs.pi_ci_rc }}"
          SZ="${{ steps.build-pi-ci-bundle-atomic.outputs.tarball_bytes }}"
          TB="${{ steps.build-pi-ci-bundle-atomic.outputs.tarball }}"
          {
            echo ''
            echo "#### 📦 pretty-index-mismatch-ci bundle (MATRIX=atomic, ${{ matrix.os }})"
            echo ''
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| tarball | \`${TB:-<missing>}\` |"
            echo "| filename | \`$(basename "${TB:-unknown}")\` |"
            echo "| pi_ci exit code | \`${RC:-?}\` |"
            echo "| tarball size | \`${SZ:-?}\` bytes |"
            echo ''
            echo "- [download \`$(basename "$TB")\`]($URL)"
            echo "  - \`summary.json\` / \`summary.md\` — aggregate mismatch summary"
            echo "  - \`validate-report.json\` — validator machine-readable report (always present, even when empty)"
            echo "  - \`validate-annotations.txt\` — validator stderr annotations (always present, even when empty)"
            echo "  - \`validate-schema-assertion.txt\` — jq schema-assertion stderr (empty on pass, populated on fail)"
            echo "  - \`diff.json\` — baseline diff (when \`PI_BASELINE\` was provided)"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      # Also upload the two key debugging files as a standalone artifact so
      # they can be linked DIRECTLY from the step summary (no tarball extract
      # needed). The Makefile pre-creates both files as its first action, so
      # this runs even when `pretty-index-mismatch-ci` fails very early.
      - name: upload pretty-index-mismatch-ci validator files (MATRIX=atomic)
        id: upload-pi-ci-validator-atomic
        if: always() && hashFiles('/tmp/pi-ci-atomic/validate-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-mismatch-ci-validator-atomic-${{ matrix.os }}
          path: |
            /tmp/pi-ci-atomic/validate-report.json
            /tmp/pi-ci-atomic/validate-schema-assertion.txt
          if-no-files-found: warn
          retention-days: 14

      # Always emit the validator-files section so reviewers see either the
      # direct link OR an explicit "not uploaded" note — never a silent gap.
      - name: link pretty-index-mismatch-ci validator files in step summary (MATRIX=atomic)
        if: always()
        shell: bash
        run: |
          URL="${{ steps.upload-pi-ci-validator-atomic.outputs.artifact-url }}"
          {
            echo ''
            echo "##### 🔎 pretty-index-mismatch-ci validator files (MATRIX=atomic, ${{ matrix.os }})"
            echo ''
            if [ -n "$URL" ]; then
              echo "- [\`validate-report.json\` + \`validate-schema-assertion.txt\`]($URL) — direct artifact (no tarball extract required)"
            else
              echo "- _validator files not uploaded for this run (pretty-index-mismatch-ci failed before producing \`/tmp/pi-ci-atomic/validate-report.json\`)_"
            fi
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: assert pretty-index-mismatch-ci summary links (MATRIX=atomic)
        id: assert-pi-ci-summary-links-atomic
        if: always()
        shell: bash
        run: scripts/ci/assert-pi-ci-summary-links.sh "$GITHUB_STEP_SUMMARY" atomic

      - name: generate extracted-tree manifest for validator upload (MATRIX=atomic)
        if: always() && failure()
        shell: bash
        run: |
          set -u
          out=/tmp/pi-ci-atomic
          mf="$out/extracted-tree.txt"
          mkdir -p "$out"
          {
            echo "# extracted-tree for $out (generated on assertion/step failure)"
            echo "# generated-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# format: <size-bytes>\\t<path-relative-to-$out>"
            if [ -d "$out" ]; then
              (cd "$out" && find . -type f 2>/dev/null | sort | while read -r f; do
                sz=$(wc -c < "$f" 2>/dev/null | tr -d ' ')
                printf "%s\t%s\n" "$sz" "$f"
              done)
            else
              echo "# (directory $out does not exist)"
            fi
          } > "$mf"
          echo "wrote $mf"
          cat "$mf"

      - name: upload validator files on any summary/assertion failure (MATRIX=atomic)
        # Fire on ANY prior step failure in this job (not just the specific
        # summary-link assertion) so debug artifacts are always available.
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-mismatch-ci-validator-files-atomic-${{ matrix.os }}
          path: |
            /tmp/pi-ci-atomic/validate-report.json
            /tmp/pi-ci-atomic/validate-schema-assertion.txt
            /tmp/pi-ci-atomic/extracted-tree.txt
          if-no-files-found: warn
          retention-days: 14







      - name: assert pretty-index failure artifact was uploaded (MATRIX=atomic)
        if: failure()
        shell: bash
        run: |
          if [[ -z "${{ steps.upload-pretty-failure.outputs.artifact-url }}" ]]; then
            echo "::error title=pretty-index upload missing (MATRIX=atomic)::expected artifact schema-drift-diff-replay-pretty-index-failure-${{ matrix.os }} was not uploaded"
            exit 1
          fi
      - name: append pretty-index failure artifact links to step summary (MATRIX=atomic)
        if: failure() && steps.upload-pretty-failure.outputs.artifact-url != ''
        shell: bash
        run: |
          URL="${{ steps.upload-pretty-failure.outputs.artifact-url }}"
          NAME="schema-drift-diff-replay-pretty-index-failure-${{ matrix.os }}"
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          echo "::notice title=pretty-index failure (MATRIX=atomic)::artifact=$NAME dir=$DIR url=$URL"

          {
            echo ''
            echo "#### 📎 pretty-index.json failure diagnostics (MATRIX=atomic)"
            echo ''
            echo "- Artifact: [$NAME]($URL) (retention 14 days)"
            echo "  - \`pretty-index.json\` — post-migration index seen by the validator"
            echo "  - \`pretty-index.pre-check.json\` — raw generator output BEFORE --auto-migrate"
            echo "  - \`pretty-index.report.json\` — validator --report machine-readable errors"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: append pretty artifact link to step summary
        if: always() && steps.upload-pretty.outputs.artifact-url != ''
        shell: bash
        run: |
          shopt -s nullglob
          URL="${{ steps.upload-pretty.outputs.artifact-url }}"
          NAME="schema-drift-diff-replay-pretty-${{ matrix.os }}"
          {
            echo ''
            echo "- [$NAME]($URL) — pretty-printed \`replay-summary.json\` (\`*.pretty.txt\`, \`*.pretty.md\`) + machine-readable triage index (\`pretty-index.json\`), retention 14 days"
            echo ''
            echo '  Per-summary files (inside the artifact above):'
            # Sorted so link order (*.pretty.md before *.pretty.txt,
            # pretty-index.json last) is deterministic across runs/OSes.
            for f in $(printf '%s\n' artifacts/schema-drift-diff-replay-verify/pretty/*.pretty.txt | LC_ALL=C sort); do
              [[ -f "$f" ]] || continue
              base="${f##*/}"; base="${base%.pretty.txt}"
              echo "  - \`${base}\` → [\`${base}.pretty.md\`]($URL), [\`${base}.pretty.txt\`]($URL)"
            done
            if [[ -f artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json ]]; then
              echo "  - [pretty-index.json]($URL) — aggregate triage (fail_reason / exit_code / pretty filenames per summary)"
            fi

          } >> "$GITHUB_STEP_SUMMARY"



      # Integration check: parse $GITHUB_STEP_SUMMARY after the pretty
      # blocks were appended and assert it actually contains the
      # pretty-printed replay-summary content. This catches regressions
      # where the pretty step silently no-ops (missing python, wrong
      # glob) or where the schema drifts and the printer bails to the
      # `(pretty-print failed for ...)` fallback. When no
      # replay-summary.json exists at all (e.g. prepare-replay was
      # skipped) the check is a no-op — that's the sensible fallback.
      - name: verify step summary contains pretty replay-summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          summaries=(artifacts/schema-drift-diff-replay/*/replay-summary.json)
          if [[ ${#summaries[@]} -eq 0 ]]; then
            echo "no replay-summary.json files produced -> skipping step-summary assertion"
            exit 0
          fi
          test -s "$GITHUB_STEP_SUMMARY" || { echo "step summary file is empty"; exit 1; }
          grep -q "== replay-summary ==" "$GITHUB_STEP_SUMMARY" \
            || { echo "step summary is missing the pretty '== replay-summary ==' header"; exit 1; }
          grep -q "(pretty-print failed for" "$GITHUB_STEP_SUMMARY" \
            && { echo "pretty-print fallback fired -> schema drift?"; exit 1; }
          # Sensible fallback: if none of the produced summaries carry a
          # non-empty manifest_mapping, the '-- manifest_mapping --'
          # header must NOT appear in the step summary.
          if ! grep -l '"manifest_mapping": \[ *{' "${summaries[@]}" >/dev/null 2>&1; then
            grep -q -- "-- manifest_mapping --" "$GITHUB_STEP_SUMMARY" \
              && { echo "ghost 'manifest_mapping' header without any mapping data"; exit 1; } || true
          fi
          echo "step-summary content check OK (${#summaries[@]} replay-summary.json file(s))"







  # Nightly parallel-writer stress job for --json-out. Race conditions in
  # the atomic rename / stale-tmp cleanup path only surface occasionally,
  # so we run the stress + concurrency suites on a schedule to catch them
  # over time without slowing every PR.
  schema-drift-diff-stress-nightly:
    name: schema-drift-diff --json-out stress (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Knobs (all optional). Contributors reproducing locally set the same
    # env vars — see docs/schema-drift-diff-test-hooks.md.
    env:
      SCHEMA_DRIFT_DIFF_STRESS_ITERATIONS: ${{ vars.SCHEMA_DRIFT_DIFF_STRESS_ITERATIONS || '5' }}
      SCHEMA_DRIFT_DIFF_FUZZ_SEED: ${{ vars.SCHEMA_DRIFT_DIFF_FUZZ_SEED }}
      SCHEMA_DRIFT_DIFF_READER_DURATION_MS: ${{ vars.SCHEMA_DRIFT_DIFF_READER_DURATION_MS }}
      SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN: ${{ vars.SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN }}
      SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS: ${{ vars.SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: parallel --json-out stress + concurrency
        shell: bash
        run: |
          mkdir -p artifacts/schema-drift-diff-stress
          DEFAULT_PATTERN='concurrency \+ tmp-file hygiene|stress \+ read-only \+ stderr wording|concurrent reader \+ fuzz \+ unsafe symlink'
          PATTERN="${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-$DEFAULT_PATTERN}"
          TIMEOUT_MS="${SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS:-60000}"
          for i in $(seq 1 "${SCHEMA_DRIFT_DIFF_STRESS_ITERATIONS}"); do
            echo "::group::stress iteration $i"
            bunx vitest run scripts/__tests__/schema-drift-pr-comment.test.ts \
              -t "$PATTERN" \
              --testTimeout="$TIMEOUT_MS" \
              --reporter=verbose \
              > >(tee -a "artifacts/schema-drift-diff-stress/vitest-iter-$i.stdout.log") \
              2> >(tee -a "artifacts/schema-drift-diff-stress/vitest-iter-$i.stderr.log" >&2)
            echo "::endgroup::"
          done
      - name: print replay block on failure
        if: failure() || cancelled()
        shell: bash
        run: |
          SEED="$(grep -hoE 'SCHEMA_DRIFT_DIFF_FUZZ_SEED=[0-9]+' artifacts/schema-drift-diff-stress/*.stderr.log 2>/dev/null | tail -n1 | cut -d= -f2)"
          SEED="${SEED:-${SCHEMA_DRIFT_DIFF_FUZZ_SEED:-<unset>}}"
          echo "::group::schema-drift-diff replay block (copy verbatim)"
          cat <<EOF
          # ---- schema-drift-diff --json-out stress replay block ----
          SCHEMA_DRIFT_DIFF_FUZZ_SEED=${SEED}
          SCHEMA_DRIFT_DIFF_READER_DURATION_MS=${SCHEMA_DRIFT_DIFF_READER_DURATION_MS:-300}
          SCHEMA_DRIFT_DIFF_STRESS_ITERATIONS=${SCHEMA_DRIFT_DIFF_STRESS_ITERATIONS}
          SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN=${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-concurrent reader \+ fuzz \+ unsafe symlink}
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS=${SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS:-60000}

          # Local reproduction:
          scripts/replay-schema-drift-diff-fuzz.sh ${SEED} ${SCHEMA_DRIFT_DIFF_READER_DURATION_MS:-300} "${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-concurrent reader \+ fuzz \+ unsafe symlink}"
          # ----------------------------------------------------------
          EOF
          echo "::endgroup::"

      - name: capture failing --json-out destinations
        if: failure() || cancelled()
        shell: bash
        run: |
          mkdir -p artifacts/schema-drift-diff-stress/dest-snapshot
          {
            find "${TMPDIR:-/tmp}" -maxdepth 3 -name 'schema-drift-report-*' -print 2>/dev/null || true
            find "${RUNNER_TEMP:-/tmp}" -maxdepth 3 -name 'schema-drift-report-*' -print 2>/dev/null || true
          } | sort -u | tee artifacts/schema-drift-diff-stress/dest-listing.txt | while read -r d; do
            [ -d "$d" ] || continue
            base="artifacts/schema-drift-diff-stress/dest-snapshot/$(basename "$d")"
            mkdir -p "$base"
            cp -a "$d"/. "$base"/ 2>/dev/null || true
          done
      - name: prepare replay folder (dry-run materialize)
        id: prepare-replay
        if: always()
        shell: bash
        run: |
          SEED="$(grep -hoE 'SCHEMA_DRIFT_DIFF_FUZZ_SEED=[0-9]+' artifacts/schema-drift-diff-stress/*.stderr.log 2>/dev/null | tail -n1 | cut -d= -f2)"
          SEED="${SEED:-${SCHEMA_DRIFT_DIFF_FUZZ_SEED:-0}}"
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS="${SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS:-60000}" \
            scripts/replay-schema-drift-diff-fuzz.sh \
              "$SEED" \
              "${SCHEMA_DRIFT_DIFF_READER_DURATION_MS:-300}" \
              "${SCHEMA_DRIFT_DIFF_TEST_NAME_PATTERN:-concurrent reader \+ fuzz \+ unsafe symlink}" \
              --dry-run
          FOLDER="$(ls -dt artifacts/schema-drift-diff-replay/*/ 2>/dev/null | head -n1)"
          echo "folder=${FOLDER%/}" >> "$GITHUB_OUTPUT"
      - name: dry-run verify replay folder integrity
        if: always() && steps.prepare-replay.outputs.folder != ''
        shell: bash
        run: |
          mkdir -p artifacts/schema-drift-diff-replay-verify
          LOG="artifacts/schema-drift-diff-replay-verify/dry-run-verify.log"
          set +e
          scripts/replay-schema-drift-diff-fuzz.sh \
            --from "${{ steps.prepare-replay.outputs.folder }}" \
            --dry-run --verbose --json-summary 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          echo "$RC" > artifacts/schema-drift-diff-replay-verify/dry-run-verify.exit_code
          if [ "${{ job.status }}" = "success" ]; then exit 0; else exit "$RC"; fi

      - name: materialize replay folder on failure (real replay)
        if: (failure() || cancelled()) && steps.prepare-replay.outputs.folder != ''
        shell: bash
        run: scripts/replay-schema-drift-diff-fuzz.sh --from "${{ steps.prepare-replay.outputs.folder }}" || true
      - name: upload stress debug artifacts
        id: upload-stress
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-stress-debug-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            artifacts/schema-drift-diff-stress/*.log
            artifacts/schema-drift-diff-stress/dest-listing.txt
            artifacts/schema-drift-diff-stress/dest-snapshot/**
            artifacts/schema-drift-diff-replay/**
      - name: print copy-paste replay command
        if: (failure() || cancelled()) && steps.upload-stress.outcome == 'success'
        shell: bash
        run: |
          FOLDER="$(ls -dt artifacts/schema-drift-diff-replay/*/ 2>/dev/null | head -n1)"
          FOLDER="${FOLDER%/}"
          [ -n "$FOLDER" ] || { echo "no replay folder found — skipping"; exit 0; }
          REL="${FOLDER#artifacts/schema-drift-diff-replay/}"
          SEED="$(awk -F: '$1=="SCHEMA_DRIFT_DIFF_FUZZ_SEED"{sub(/^[^:]*:[ \t]*/,""); print; exit}' "$FOLDER/manifest.txt")"
          READER="$(awk -F: '$1=="SCHEMA_DRIFT_DIFF_READER_DURATION_MS"{sub(/^[^:]*:[ \t]*/,""); print; exit}' "$FOLDER/manifest.txt")"
          TIMEOUT="$(awk -F: '$1=="SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS"{sub(/^[^:]*:[ \t]*/,""); print; exit}' "$FOLDER/manifest.txt")"
          BLOCK=$(cat <<EOF
          # 1) Download the CI artifact:
          #    gh run download ${GITHUB_RUN_ID} -n schema-drift-diff-stress-debug-${{ matrix.os }} -D ./replay-download
          # 2) Replay from the manifest (checksum-verified):
          scripts/replay-schema-drift-diff-fuzz.sh --from ./replay-download/${REL}
          #
          # Or replay directly:
          SCHEMA_DRIFT_DIFF_TEST_TIMEOUT_MS=${TIMEOUT} \\
            scripts/replay-schema-drift-diff-fuzz.sh ${SEED} ${READER} "concurrent reader \+ fuzz \+ unsafe symlink"
          #
          # manifest_path: ${FOLDER}/manifest.txt
          # env_context:   ${FOLDER}/env.sh
          # seed:          ${SEED}
          # reader_ms:     ${READER}
          # timeout_ms:    ${TIMEOUT}
          EOF
          )
          mkdir -p artifacts/schema-drift-diff-replay-verify
          printf '%s\n' "$BLOCK" > artifacts/schema-drift-diff-replay-verify/replay-command.sh
          chmod +x artifacts/schema-drift-diff-replay-verify/replay-command.sh || true
          echo "::group::schema-drift-diff copy-paste replay command"
          printf '%s\n' "$BLOCK"
          echo "::endgroup::"
          {
            echo '### schema-drift-diff --json-out stress replay (copy-paste)'
            echo ''
            echo '```bash'
            printf '%s\n' "$BLOCK"
            echo '```'
            if [ -r "$FOLDER/replay-summary.txt" ]; then
              echo ''
              echo '<details><summary>replay-summary.txt</summary>'
              echo ''
              echo '```'
              cat "$FOLDER/replay-summary.txt"
              echo '```'
              echo ''
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Retention: 14 days (see the atomic-crossos job above for the
      # rationale + where to find these in the Actions UI). Uploaded on
      # success AND failure so you can diff a green stress run's
      # replay-summary.json against a red one without re-running.
      - name: upload dry-run verify + replay-command artifacts
        id: upload-verify
        if: always() && steps.prepare-replay.outputs.folder != ''
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-stress-replay-verify-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/schema-drift-diff-replay-verify/dry-run-verify.log
            artifacts/schema-drift-diff-replay-verify/dry-run-verify.exit_code
            artifacts/schema-drift-diff-replay-verify/replay-command.sh
            artifacts/schema-drift-diff-replay/**/replay-summary.json
      - name: append verify artifact link to step summary
        if: always() && steps.upload-verify.outputs.artifact-url != ''
        shell: bash
        run: |
          {
            echo ''
            echo '#### schema-drift-diff stress replay verify artifacts (${{ matrix.os }})'
            echo ''
            echo "- [schema-drift-diff-stress-replay-verify-${{ matrix.os }}](${{ steps.upload-verify.outputs.artifact-url }}) — contains \`dry-run-verify.log\`, \`replay-command.sh\`, and every \`replay-summary.json\`"
            echo "  - CLI: \`gh run download ${GITHUB_RUN_ID} -n schema-drift-diff-stress-replay-verify-${{ matrix.os }}\`"
            echo "  - Retention: 14 days from this run. Uploaded on both success and failure."
          } >> "$GITHUB_STEP_SUMMARY"
      # Pretty-print each replay-summary.json into the step summary so
      # nightly-stress debuggers can see the summary inline without
      # downloading the verify artifact.
      - name: append pretty replay-summary to step summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p artifacts/schema-drift-diff-replay-verify/pretty
          index="artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json"
          # v1 envelope — mirror of the regular-matrix generator above.
          echo '{"schema_version": 1, "entries": [' > "$index"
          first=1
          hard_fail=0
          count=0
          for f in $(printf '%s\n' artifacts/schema-drift-diff-replay/*/replay-summary.json | LC_ALL=C sort); do
            [[ -f "$f" ]] || continue
            count=$((count + 1))

            base="$(basename "$(dirname "$f")")"
            reason="$(python3 -c "import json,sys
try:
  d=json.load(open(sys.argv[1]))
  r=d.get('fail_reason') or 'ok'
except Exception:
  r='unparseable'
print(r)" "$f" 2>/dev/null | tr -c '[:alnum:]._-' '_' | cut -c1-40)"
            reason="${reason:-ok}"
            exit_code="$(python3 -c "import json,sys
try:
  d=json.load(open(sys.argv[1]))
  print(d.get('exit_code') if d.get('exit_code') is not None else 'null')
except Exception:
  print('null')" "$f" 2>/dev/null)"
            out="artifacts/schema-drift-diff-replay-verify/pretty/${base}.${reason}.pretty.txt"
            md="artifacts/schema-drift-diff-replay-verify/pretty/${base}.${reason}.pretty.md"
            python3 scripts/pretty-replay-summary.py --fixed-widths --no-color "$f" > "$out" 2>&1
            rc=$?
            python3 scripts/pretty-replay-summary.py --fixed-widths --no-color --markdown "$f" > "$md" 2>&1 || true
            case "$rc" in
              0) status="ok" ;;
              3) status="schema-error"; hard_fail=1 ;;
              4) status="missing-file"; hard_fail=1 ;;
              5) status="unreadable";   hard_fail=1 ;;
              6) status="parse-error";  hard_fail=1 ;;
              *) status="exit=$rc";     hard_fail=1 ;;
            esac
            [[ $first -eq 0 ]] && echo ',' >> "$index"
            first=0
            python3 -c "import json,sys
print(json.dumps({
  'folder': sys.argv[1],
  'summary_file': sys.argv[2],
  'pretty_txt': sys.argv[3],
  'pretty_md': sys.argv[4],
  'fail_reason': sys.argv[5],
  'exit_code': None if sys.argv[6] == 'null' else int(sys.argv[6]),
  'pretty_status': sys.argv[7],
  'pretty_exit_code': int(sys.argv[8]),
}, indent=2))" "$base" "$f" "$out" "$md" "$reason" "$exit_code" "$status" "$rc" >> "$index"
            {
              echo ''
              echo "<details><summary>pretty replay-summary: <code>${f}</code> — fail_reason=<code>${reason}</code> (${status})</summary>"
              echo ''
              if [[ "$rc" -eq 0 ]]; then
                cat "$md"
              else
                echo '```'
                cat "$out" || echo "(pretty-print failed for $f)"
                echo '```'
              fi
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo ']}' >> "$index"
          # Snapshot the generator output BEFORE any migration so failure
          # uploads always include the exact bytes the validator saw.
          cp -- "$index" "${index}.pre-check.json"
          report="${index%.json}.report.json"
          # Single-entry-point drift + schema check via the shared local
          # script. --report writes the validator's machine-readable JSON
          # so the failure-upload step can attach it as an artifact.
          if ! val_err=$(scripts/check-pretty-index-local.sh --report "$report" "$index" 2>&1); then
            rc=$?
            first_line=$(printf '%s\n' "$val_err" | head -n1)
            echo "::error file=${index}::pretty-index.json check failed (exit ${rc}): ${first_line}" >&2
            {
              echo ''
              echo "### ❌ pretty-index.json schema validation failed"
              echo ''
              echo "- Path: \`${index}\`"
              echo "- Script exit: \`${rc}\` (1=drift, 3=schema, 4=missing)"
              echo ''
              echo '```'
              printf '%s\n' "$val_err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo ''
            echo "### ✅ pretty-index.json validated (${count} entr$( [[ $count -eq 1 ]] && echo y || echo ies ) on \`${{ matrix.os }}\`)"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$hard_fail" -ne 0 ]]; then
            echo "pretty-replay-summary.py returned a schema/file error (see step summary)" >&2
            exit 1
          fi

      - name: upload pretty replay-summary artifact
        id: upload-pretty-stress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-stress-replay-pretty-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/schema-drift-diff-replay-verify/pretty/*.pretty.txt
            artifacts/schema-drift-diff-replay-verify/pretty/*.pretty.md
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json
      - name: pretty-index-check diagnostics (MATRIX=stress)
        if: failure()
        shell: bash
        run: |
          # Mirror `make pretty-index-check MATRIX=stress` so the job log
          # names the exact stress-artifact prefix uploaded below.
          make -s pretty-index-diagnostics MATRIX=stress || true
      - name: assert pretty-index failure diagnostics exist (MATRIX=stress)
        if: failure()
        shell: bash
        run: |
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          missing=()
          for f in pretty-index.json pretty-index.pre-check.json pretty-index.report.json; do
            [[ -f "$DIR/$f" ]] || missing+=("$DIR/$f")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=pretty-index diagnostics missing (MATRIX=stress)::expected artifact files not on disk: ${missing[*]}"
            echo "expected artifact name: schema-drift-diff-stress-replay-pretty-index-failure-${{ matrix.os }}"
            exit 1
          fi
          echo "::notice title=pretty-index diagnostics present (MATRIX=stress)::all 3 expected files found in $DIR"
      - name: compute pretty-index diagnostic checksums (MATRIX=stress)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          ( cd "$DIR" && sha256sum \
              pretty-index.json \
              pretty-index.pre-check.json \
              pretty-index.report.json \
              > pretty-index.checksums.sha256 )
          echo "::group::pretty-index checksums (MATRIX=stress)"
          cat "$DIR/pretty-index.checksums.sha256"
          echo "::endgroup::"
      - name: upload pretty-index failure diagnostics (MATRIX=stress)
        id: upload-pretty-failure-stress
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-diff-stress-replay-pretty-index-failure-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.json
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.pre-check.json
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.report.json
            artifacts/schema-drift-diff-replay-verify/pretty/pretty-index.checksums.sha256
      - name: verify pretty-index diagnostic checksums (MATRIX=stress)
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          DIR="artifacts/schema-drift-diff-replay-verify/pretty"
          REPORT="/tmp/pi-mismatch-stress.json"
          if ! ( cd "$DIR" && sha256sum -c pretty-index.checksums.sha256 ) > /tmp/pi-verify-stress.log 2>&1; then
            echo "::group::pretty-index checksum MISMATCH (MATRIX=stress)"
            cat /tmp/pi-verify-stress.log
            echo ""
            echo "── expected (from pretty-index.checksums.sha256) ──"
            cat "$DIR/pretty-index.checksums.sha256"
            echo "── actual (recomputed now) ──"
            ( cd "$DIR" && sha256sum pretty-index.json pretty-index.pre-check.json pretty-index.report.json 2>/dev/null || true )
            echo "── per-file diff ──"
            first=1
            printf '{"schema":"pretty-index-checksum-mismatch/v1","scope":"stress","matrix":"stress","dir":"%s","results":[' "$DIR" > "$REPORT"
            while IFS= read -r line; do
              if [[ "$line" == *"FAILED"* || "$line" == *"OK"* ]]; then
                fname="${line%%:*}"
                exp=$(grep " $fname\$" "$DIR/pretty-index.checksums.sha256" | awk '{print $1}')
                act=$( ( cd "$DIR" && sha256sum "$fname" 2>/dev/null ) | awk '{print $1}')
                status=$([[ "$exp" == "$act" && -n "$exp" ]] && echo OK || echo MISMATCH)
                echo "  $fname  expected=${exp:-<none>}  actual=${act:-<missing>}  [$status]"
                [ $first -eq 1 ] || printf ',' >> "$REPORT"; first=0
                printf '{"file":"%s","expected":"%s","actual":"%s","status":"%s"}' \
                  "$fname" "$exp" "$act" "$status" >> "$REPORT"
              fi
            done < /tmp/pi-verify-stress.log
            printf ']}\n' >> "$REPORT"
            echo ""
            echo "wrote machine-readable mismatch report: $REPORT"
            echo "::endgroup::"
            echo "::error title=pretty-index checksum mismatch (MATRIX=stress)::one or more files under $DIR do not match their recorded sha256; see the group above and the uploaded pretty-index-checksum-mismatch-stress-${{ matrix.os }} artifact"
            exit 1
          fi
          cat /tmp/pi-verify-stress.log
          echo "::notice title=pretty-index checksums verified (MATRIX=stress)::sha256sum -c passed for $DIR/pretty-index.checksums.sha256"

      - name: upload pretty-index checksum mismatch report (MATRIX=stress)
        if: failure() && hashFiles('/tmp/pi-mismatch-stress.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-checksum-mismatch-stress-${{ matrix.os }}
          path: /tmp/pi-mismatch-stress.json
          if-no-files-found: error
          retention-days: 14

      - name: build pretty-index mismatch summary JSON (MATRIX=stress)
        if: failure() && hashFiles('/tmp/pi-mismatch-stress.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          make -s pretty-index-mismatch-summary-json \
            PI_REPORT_PATH=/tmp/pi-mismatch-stress.json \
            PI_SUMMARY_JSON_PATH=/tmp/pi-mismatch-summary-stress.json
          echo "── summary (MATRIX=stress) ──"
          cat /tmp/pi-mismatch-summary-stress.json

      - name: validate pretty-index mismatch summary JSON (MATRIX=stress)
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-stress.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          make -s pretty-index-mismatch-summary-validate \
            PI_SUMMARY_JSON_PATH=/tmp/pi-mismatch-summary-stress.json

      - name: render pretty-index mismatch summary markdown (MATRIX=stress)
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-stress.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          make -s pretty-index-mismatch-summary-md \
            PI_SUMMARY_JSON_PATH=/tmp/pi-mismatch-summary-stress.json \
            PI_SUMMARY_MD_PATH=/tmp/pi-mismatch-summary-stress.md

      - name: upload pretty-index mismatch summary JSON (MATRIX=stress)
        id: upload-pi-summary-stress
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-stress.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-mismatch-summary-stress-${{ matrix.os }}
          path: |
            /tmp/pi-mismatch-summary-stress.json
            /tmp/pi-mismatch-summary-stress.md
          if-no-files-found: error
          retention-days: 14

      - name: append pretty-index mismatch summary to step summary (MATRIX=stress)
        if: failure() && hashFiles('/tmp/pi-mismatch-summary-stress.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          F=/tmp/pi-mismatch-summary-stress.json
          URL="${{ steps.upload-pi-summary-stress.outputs.artifact-url }}"
          {
            echo ""
            echo "### pretty-index mismatch summary (MATRIX=stress, ${{ matrix.os }})"
            echo ""
            echo "| matrix | total | mismatched | missing |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.matrices | to_entries[] | "| \(.key) | \(.value.total) | \(.value.mismatched) | \(.value.missing) |"' -- "$F"
            jq -r '.totals   | "| **total** | \(.total) | \(.mismatched) | \(.missing) |"' -- "$F"
            echo ""
            if [ -n "$URL" ]; then
              echo "- [download \`pretty-index-mismatch-summary-stress-${{ matrix.os }}.json\` (+ .md)]($URL)"
            else
              echo "- _summary.json artifact URL unavailable_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: build pretty-index-mismatch-ci bundle (MATRIX=stress)
        id: build-pi-ci-bundle-stress
        if: failure() && hashFiles('/tmp/pi-mismatch-stress.json') != ''
        shell: bash
        # continue-on-error so the upload + step-summary steps run even
        # when `pretty-index-mismatch-ci` fails before completion — the
        # Makefile always tars the partial bundle on validator failure.
        continue-on-error: true
        run: |
          set +e
          TARBALL=/tmp/pi-ci-stress.tar.gz
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          make -s pretty-index-mismatch-ci \
            PI_REPORT_PATH=/tmp/pi-mismatch-stress.json \
            PI_CI_OUT_DIR=/tmp/pi-ci-stress \
            PI_CI_BUNDLE_PATH="$TARBALL"
          rc=$?
          echo "pi_ci_rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ -f "$TARBALL" ]]; then
            sz=$(wc -c < "$TARBALL" | tr -d ' ')
            echo "tarball_exists=true"  >> "$GITHUB_OUTPUT"
            echo "tarball_bytes=$sz"    >> "$GITHUB_OUTPUT"
          else
            echo "tarball_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pretty-index-mismatch-ci (stress)::tarball $TARBALL was not produced"
          fi
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "::warning title=pretty-index-mismatch-ci (stress)::exited $rc; partial bundle will still be uploaded if present"
          fi

      - name: upload pretty-index-mismatch-ci bundle (MATRIX=stress)
        id: upload-pi-ci-bundle-stress
        if: always() && steps.build-pi-ci-bundle-stress.outputs.tarball_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pretty-index-mismatch-ci-bundle-stress-${{ matrix.os }}
          path: ${{ steps.build-pi-ci-bundle-stress.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14

      - name: link pretty-index-mismatch-ci bundle in step summary (MATRIX=stress)
        if: always() && steps.upload-pi-ci-bundle-stress.outputs.artifact-url != ''
        shell: bash
        run: |
          URL="${{ steps.upload-pi-ci-bundle-stress.outputs.artifact-url }}"
