      # debug-summary suite is verbose and is only exercised when the
      # workflow_dispatch `sticky_debug` input is set to 1; otherwise
      # we run the lean integration/perf set.
      - name: Sticky-upsert integration + perf suite
        env:
          STICKY_DEBUG: ${{ inputs.sticky_debug || '0' }}
          # Always-on compact per-scenario scanStats summary in CI logs.
          # Tests no-op when this is unset; we enable it here so reviewers
          # see the marker-scan profile inline without re-running locally.
          STICKY_TEST_SUMMARY: '1'
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          BASE_TESTS=(
            scripts/__tests__/ci-sticky-upsert-paginated-list.test.ts
            scripts/__tests__/ci-sticky-upsert-malformed-marker-metadata.test.ts
            scripts/__tests__/ci-sticky-upsert-lock-then-rerun.test.ts
            scripts/__tests__/ci-sticky-upsert-scan-perf-bound.test.ts
            scripts/__tests__/ci-sticky-upsert-scan-bounded.test.ts
            scripts/__tests__/ci-sticky-upsert-head-scan-window-integration.test.ts
            scripts/__tests__/ci-sticky-upsert-parallel-jobs-convergence.test.ts
            scripts/__tests__/ci-sticky-upsert-concurrent-cleanup.test.ts
            scripts/__tests__/ci-sticky-upsert-lock-strategy.test.ts
            scripts/__tests__/ci-sticky-upsert-delete-fallback-to-lock.test.ts
            scripts/__tests__/ci-sticky-upsert-pagination-boundary.test.ts
            scripts/__tests__/ci-sticky-upsert-empty-pages.test.ts
            scripts/__tests__/ci-sticky-marker-bom-fuzz.test.ts
            scripts/__tests__/ci-sticky-upsert-bulk-cleanup-linear.test.ts
            scripts/__tests__/ci-sticky-upsert-randomized-concurrency.test.ts
            scripts/__tests__/ci-sticky-upsert-multi-marker-paginated.test.ts
            scripts/__tests__/ci-sticky-upsert-debug-gating-drift.test.ts
            scripts/__tests__/ci-sticky-upsert-scan-stats-budgets.test.ts
            scripts/__tests__/ci-sticky-upsert-bulk-cleanup-perf-regression.test.ts
            scripts/__tests__/ci-sticky-upsert-newest-wins-pagination-overlap.test.ts
          )
          DEBUG_TESTS=(
            scripts/__tests__/ci-sticky-upsert-debug-summary-gating.test.ts
            scripts/__tests__/ci-sticky-upsert-create-debug-summary.test.ts
            scripts/__tests__/ci-sticky-upsert-flag-env-precedence.test.ts
            scripts/__tests__/ci-sticky-upsert-cli-help.test.ts
          )
          if [ "$STICKY_DEBUG" = "1" ]; then
            echo "sticky_debug=1 → including debug-summary suites"
            bunx vitest run "${BASE_TESTS[@]}" "${DEBUG_TESTS[@]}"
          else
            bunx vitest run "${BASE_TESTS[@]}"
          fi
      # Dedicated perf-only step with a stricter timeout. These suites
      # pin marker-scanning bounds (head-scan window + at most one
      # full-body fallback) and pagination/empty-page budgets, so any
      # accidental quadratic regression should blow the wall-clock here
