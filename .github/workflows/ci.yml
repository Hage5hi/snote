      # Single step printing direct download links for both the
      # manifest and its validation summary so reviewers don't have to
      # hunt through the artifacts list.
      - name: Sticky artifacts — print manifest + summary download links
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          {
            echo '### Sticky manifest & validate-summary downloads'
            echo ''
