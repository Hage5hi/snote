name = "syrin-prerender-staging"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false
routes = []

# Fail-closed scaffold only. The reserved workers.dev authority is allowed to
# serve staging, but the placeholder origin below is intentionally not
# deployable. Replace it only with a reviewed isolated non-redirecting origin.

[vars]
ORIGIN_HOST = "staging-origin.invalid"
SITE_URL = "https://note.syrin.online"
EDGE_SERVE_ORIGIN = "https://syrin-prerender-staging.thongdocnganhang1.workers.dev"
STAGING_SUPABASE_ORIGIN = "https://staging-project.invalid"

[observability]
enabled = false

[observability.logs]
invocation_logs = false

[observability.traces]
enabled = false
