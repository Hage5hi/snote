name = "syrin-prerender"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = false

# PRODUCTION NO-GO TEMPLATE.
# Do not add production routes until a dedicated origin has passed the staging
# redirect/manual-fetch suite and the reviewed hostname replaces the invalid
# placeholder below. snote.lovable.app redirects to the canonical hostname and
# would create an origin loop.
routes = []

[vars]
ORIGIN_HOST = "production-origin.invalid"
SUPABASE_PROJECT = "onfzjmfjldsbthchssfr"
SITE_URL = "https://note.syrin.online"

[observability]
enabled = false

[observability.logs]
# Invocation messages contain the request URL. Share capabilities live in the
# path during the legacy containment window, so only sanitized custom logs are
# permitted.
invocation_logs = false

[observability.traces]
# Trace spans can also retain request URLs before application redaction.
enabled = false
