  <body style="margin:0">
    <!-- Apply saved theme BEFORE React mounts to prevent white flash on light theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || ((t === "system" || !t) && sysDark);
          var root = document.documentElement;
          if (dark) {
            root.classList.add("dark");
            root.style.background = "#0f0f12";
            document.body.style.background = "#0f0f12";
          } else {
            root.classList.remove("dark");
            root.style.background = "#ffffff";
            document.body.style.background = "#ffffff";
            root.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <!-- Initial loader: visible before React hydrates so the screen isn't blank. -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="width:28px;height:28px;border:2px solid rgba(255,255,255,0.15);border-top-color:rgba(255,255,255,0.6);border-radius:50%;animation:n-spin 0.8s linear infinite"></div>
      </div>
      <style>@keyframes n-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
