<!doctype html>
<html lang="en" class="dark" style="background:#0f0f12;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Notes — Realtime markdown notes by URL</title>
    <meta name="description" content="Tạo và chia sẻ note markdown qua URL. Tự động lưu, đồng bộ realtime giữa các thiết bị, hoạt động cả khi offline.">
    <meta name="author" content="Notes" />

    <!-- PWA / Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Speed up Supabase Realtime + REST connections -->
    <link rel="preconnect" href="https://nqkjyrgrquzjvpicmcpf.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nqkjyrgrquzjvpicmcpf.supabase.co" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Notes — Realtime markdown notes">
    <meta property="og:description" content="Tạo và chia sẻ note markdown qua URL. Tự động lưu, đồng bộ realtime, offline-first.">

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Notes — Realtime markdown notes">
    <meta name="twitter:description" content="Tạo và chia sẻ note markdown qua URL. Tự động lưu, đồng bộ realtime, offline-first.">
    <link rel="icon" type="image/png" href="/icon-192.png">
  </head>

  <body style="background:#0f0f12;margin:0">
    <!-- Apply saved theme BEFORE React mounts to prevent white flash on light theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = t === "dark" || (t !== "light" && (t === "system" || !t) && sysDark) || (!t && true);
          var root = document.documentElement;
          if (dark) {
            root.classList.add("dark");
            root.style.background = "#0f0f12";
            document.body.style.background = "#0f0f12";
          } else {
            root.classList.remove("dark");
            root.style.background = "#ffffff";
            document.body.style.background = "#ffffff";
            root.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <!-- Initial loader: visible before React hydrates so the screen isn't blank. -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="width:28px;height:28px;border:2px solid rgba(255,255,255,0.15);border-top-color:rgba(255,255,255,0.6);border-radius:50%;animation:n-spin 0.8s linear infinite"></div>
      </div>
      <style>@keyframes n-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
