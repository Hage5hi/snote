# Capability tokens are opaque CSPRNG values, not Supabase Auth JWTs. These
# functions authenticate the exact Bearer value themselves and fail closed.
[functions.note-session]
verify_jwt = false

[functions.note-sync]
verify_jwt = false

[functions.note-manage]
verify_jwt = false

[functions.share-view]
verify_jwt = false

[functions.legacy-note-open]
verify_jwt = false
