<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Syrin Note</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="loader" class="loader" aria-live="polite" aria-busy="true">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading Syrin Note…</p>
    </div>

    <iframe
      id="app"
      title="Syrin Note"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="origin"
    ></iframe>

    <div id="fallback" class="fallback" hidden>
      <h1>Couldn't load Syrin Note</h1>
      <p>The side panel can't embed the app right now. You can open it in a new tab instead.</p>
      <button id="open-tab" type="button">Open in new tab</button>
      <button id="retry-load" type="button" class="secondary">Retry</button>
      <details class="diag">
        <summary>Diagnostics</summary>
        <dl>
          <dt>Iframe URL</dt><dd id="diag-url">—</dd>
          <dt>App reachable (HEAD)</dt><dd id="diag-head">—</dd>
          <dt>Ready handshake</dt><dd id="diag-ready">not received</dd>
          <dt>Retry count</dt><dd id="diag-retries">0</dd>
        </dl>
        <button id="diag-copy" type="button" class="secondary">Copy diagnostics</button>
        <button id="diag-download" type="button" class="secondary">Download diagnostics JSON</button>
      </details>
      <noscript>
        <a href="https://note.syrin.online">Open Syrin Note</a>
      </noscript>
    </div>

    <aside id="debug-bar" class="debug-bar" hidden>
      <header>
        <strong>debug</strong>
        <span id="debug-last">lastSlug: —</span>
        <button id="debug-copy" type="button">copy</button>
        <button id="debug-export" type="button" title="Download debug log as JSON">export</button>
        <label class="debug-redact" title="Redact slugs, URLs and error paths from the exported JSON">
          <input id="debug-redact" type="checkbox" />
          redact
        </label>
        <button id="debug-clear" type="button">clear</button>
      </header>
      <ol id="debug-log"></ol>
    </aside>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
